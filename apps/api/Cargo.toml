[package]
name = "caper-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
# Signs the APNs (ES256) and FCM service-account (RS256) JWTs. Already compiled
# in as the Rustls crypto provider, so push adds no new crypto stack.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
aws-config = "=1.8.14"
# Keep the modern HTTPS client without the SDKs' legacy rustls 0.21 feature.
aws-sdk-secretsmanager = { version = "=1.108.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sesv2 = { version = "=1.120.0", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"] }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
email_address = "0.2"
emojis = "0.9"
futures-util = "0.3"
hmac = "0.12"
opentelemetry = { version = "0.32", default-features = false, features = ["logs"] }
opentelemetry-appender-tracing = { version = "0.32", default-features = false, features = ["experimental_span_attributes"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["logs"] }
rand = "0.9"
redis = { version = "0.32", features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
# APNs accepts only HTTP/2.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "chrono",
    "uuid",
    "migrate",
    "macros",
] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# Mock APNs speaks HTTP/2 without TLS (prior knowledge), like the real service's framing.
axum = { version = "0.8", features = ["ws", "http2"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["logs", "testing"] }
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.29"

[lints]
workspace = true
