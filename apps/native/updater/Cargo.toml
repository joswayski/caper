[package]
name = "caper-updater"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Self-updater shared by the Caper Mac, Windows and Linux apps"
publish = false

# Built on its own, like the desktop client, and bundled into each desktop app.
[workspace]

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem"] }
flate2 = "1.1"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "s"
lto = true
