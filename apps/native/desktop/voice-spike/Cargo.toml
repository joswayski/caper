[package]
name = "caper-voice-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]
members = ["vendor/libwebrtc", "vendor/webrtc-sys", "vendor/webrtc-sys/build"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/livekit/rust-sdks"

[workspace.dependencies]
webrtc-sys = { path = "vendor/webrtc-sys", version = "0.3.46" }
webrtc-sys-build = { path = "vendor/webrtc-sys/build", version = "0.3.19" }
anyhow = "1.0"
cc = "1.0"
env_logger = "0.11"
lazy_static = "1.4"
log = "0.4"
parking_lot = "0.12"
serde = "1"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"

[dependencies]
libwebrtc = { path = "vendor/libwebrtc" }
nnnoiseless = "=0.5.2"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread"] }
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
