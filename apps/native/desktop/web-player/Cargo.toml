[package]
name = "caper-web-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Link preview video players in the operating system's web engine, for Caper Desktop"
publish = false

# The library is the part Caper itself links: the play-page allowlist and
# the helper's line protocol, with no web engine. `engine` adds the shared
# wry configuration; the `caper-web-player` helper (Linux) needs it.
[lib]
path = "src/lib.rs"

[[bin]]
name = "caper-web-player"
path = "src/main.rs"
required-features = ["engine"]

[features]
engine = ["dep:wry", "dep:gtk", "dep:raw-window-handle", "dep:webkit2gtk"]

[dependencies]
url = "2.5"
# The operating system's web engine: WebView2 on Windows, WebKitGTK on Linux.
wry = { version = "=0.57.0", optional = true }

# The same GTK and WebKitGTK bindings wry uses, for the helper's window and
# main-frame guard.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
raw-window-handle = { version = "0.6", optional = true }
webkit2gtk = { version = "=2.0.2", optional = true }

[lints.rust]
# Only the helper's X11 parent handle needs it (see main.rs).
unsafe_code = "deny"

[lints.clippy]
all = "deny"
