[package]
name = "caper-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Caper's UI-free client core: API, gateway, data model, uploads and notifications"
publish = false
# A member of the desktop workspace (../desktop/Cargo.toml), not the API's.
workspace = "../desktop"

[dependencies]
# Text drawn on edited attachments, from Satoshi Bold's outlines: the same
# font parser egui already uses, pinned to its locked version.
ab_glyph = "=0.2.32"
# AVIF photos: rav1e (pure-Rust AV1, BSD-2-Clause) in an avif-serialize
# (BSD-3-Clause) container; see src/avif.rs.
avif-serialize = "=0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Attachments decode PNG/JPEG/WebP/GIF/BMP/TIFF in pure Rust. AVIF inline
# images and AVIF/HEIC full-size images use the bundled FFmpeg instead.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
jpeg-encoder = "0.7"
keyring = { version = "3.6.3", default-features = false }
# libwebp 1.6.0, compiled from its vendored source with `cc` (no system
# library); pinned here as webpx only asks for 0.14.
libwebp-sys = { version = "=0.14.4", default-features = false, features = ["std"] }
libwebrtc = { path = "../desktop/voice-spike/vendor/libwebrtc" }
nnnoiseless = { version = "=0.5.2", default-features = false }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
png = "0.18"
rav1e = { version = "=0.8.1", default-features = false, features = ["threading"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "wav"] }
resvg = { version = "0.45.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread", "time", "sync"] }
unicode-segmentation = "=1.13.3"
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
# Lossless (screenshots) and lossy (photos) WebP through libwebp.
webpx = { version = "=0.4.0", default-features = false, features = ["encode", "icc", "std"] }

[features]
# rav1e's x86-64 assembly: about twice as fast AVIF photo encoding, identical
# output. It needs NASM at build time.
avif-asm = ["rav1e/asm"]

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
notify-rust = { version = "4.18.2", default-features = false, features = ["z"] }
zbus = "=5.19.0"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "0.61.3", features = ["UI_Notifications", "Data_Xml_Dom"] }
winreg = "0.55"
winrt-toast-reborn = "0.3.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
