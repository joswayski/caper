name: CaperApple
options:
  bundleIdPrefix: chat.caper
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
  # Lossless WebP attachments (BSD; Resources/libwebp-LICENSE.txt). Static,
  # imported implementation-only by CaperCore.
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode.git
    exactVersion: 1.6.0
configFiles:
  Release: .build/SourceRevision.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Every bundle, including embedded frameworks, needs both versions for App
    # Store validation; release.yml overrides both per release: the app version
    # (2026.11.1903) and build (2026111903). CAPER_VERSION is the version every
    # client shows (2026.11.19.3), which CFBundleShortVersionString cannot hold.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CAPER_VERSION: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      CAPER_SOURCE_REVISION: ""
targets:
  CaperRTCBridge:
    type: framework
    platform: macOS
    sources:
      - path: Sources/CaperRTCBridge/CaperRTCBridge.h
        headerVisibility: public
      - path: Sources/CaperRTCBridge/CaperRTCBridge.m
      - path: Sources/CaperRTCBridge/CaperMacAudioDevice.h
        headerVisibility: public
      - path: Sources/CaperRTCBridge/CaperMacAudioDevice.m
      - path: Sources/CaperRTCBridge/CaperVoiceNoteProcessor.h
        headerVisibility: public
      - path: Sources/CaperRTCBridge/CaperVoiceNoteProcessor.m
      - path: Sources/CaperRTCBridge/CaperDpdfnet.cpp
      - path: Sources/CaperRTCBridge/CaperDpdfnet.h
        headerVisibility: project
      - path: Sources/CaperRTCBridge/CaperDenoisePipeline.cpp
      - path: Sources/CaperRTCBridge/CaperDenoisePipeline.h
        headerVisibility: project
      - path: Sources/CaperRTCBridge/CaperVoiceDSP.c
      - path: Sources/CaperRTCBridge/CaperVoiceDSP.h
        headerVisibility: project
      - .build/rnnoise/src/denoise.c
      - .build/rnnoise/src/rnn.c
      - .build/rnnoise/src/pitch.c
      - .build/rnnoise/src/kiss_fft.c
      - .build/rnnoise/src/celt_lpc.c
      - .build/rnnoise/src/nnet.c
      - .build/rnnoise/src/nnet_default.c
      - .build/rnnoise/src/parse_lpcnet_weights.c
      - .build/rnnoise/src/rnnoise_data.c
      - .build/rnnoise/src/rnnoise_tables.c
      - path: Sources/CaperRTCBridge/sdk
        buildPhase: none
      - path: ../../web/public/audio/dpdfnet8-v2/dpdfnet8_48khz_hr.onnx
        buildPhase: resources
      - path: ../../web/public/audio/dpdfnet8-v2/LICENSE-APACHE-2.0
        buildPhase: resources
      - path: .build/onnxruntime-osx-universal2-1.23.2/LICENSE
        buildPhase: resources
      - path: .build/onnxruntime-osx-universal2-1.23.2/ThirdPartyNotices.txt
        buildPhase: resources
      - path: .build/rnnoise/COPYING
        buildPhase: resources
    dependencies:
      - package: WebRTC
        product: WebRTC
        link: true
        embed: false
      - framework: .build/onnxruntime-osx-universal2-1.23.2/lib/libonnxruntime.1.23.2.dylib
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.rtc-bridge
        PRODUCT_MODULE_NAME: CaperRTCBridge
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Sources/CaperRTCBridge $(SRCROOT)/.build/onnxruntime-osx-universal2-1.23.2/include $(SRCROOT)/.build/rnnoise/include $(SRCROOT)/.build/rnnoise/src"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/.build/onnxruntime-osx-universal2-1.23.2/lib"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) RNNOISE_BUILD=1 DISABLE_DEBUG_FLOAT=1"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
  CaperCoreMacOS:
    type: framework
    platform: macOS
    sources:
      - path: Sources/CaperCore
        excludes: [EmojiAssets, InvitationAssets]
      - path: Sources/CaperCore/EmojiAssets
        buildPhase: resources
      - path: Sources/CaperCore/InvitationAssets
        buildPhase: resources
      - path: ../../web/public/audio/effects
        buildPhase: resources
        excludes: [README.md]
    dependencies:
      - target: CaperRTCBridge
        embed: false
      - package: WebRTC
        product: WebRTC
        link: true
        embed: false
      - package: libwebp
        product: libwebp
        link: true
        embed: false
      # AVIF photo attachments: libavif 1.4.2 + aom 3.15.1 encoder, a static
      # XCFramework from joswayski/libavif-apple, fetched by prepare.sh (BSD;
      # Resources/libavif-LICENSE.txt, libaom-LICENSE.txt, libaom-PATENTS.txt).
      # Imported implementation-only by CaperCore.
      - framework: .build/libavif-1.4.2/libavif.xcframework
        link: true
        embed: false
      # Shared Rust logic (apps/native/mobile): a static XCFramework that
      # prepare.sh builds with mobile/build-apple.sh. Imported implementation-only.
      - framework: .build/CaperMobile.xcframework
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.core
        PRODUCT_NAME: CaperCore
        PRODUCT_MODULE_NAME: CaperCore
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  CaperCoreIOS:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CaperCore
        excludes: [EmojiAssets, InvitationAssets]
      - path: Sources/CaperCore/EmojiAssets
        buildPhase: resources
      - path: Sources/CaperCore/InvitationAssets
        buildPhase: resources
      - path: ../../web/public/audio/effects
        buildPhase: resources
        excludes: [README.md]
    dependencies:
      - target: CaperRTCBridgeIOS
        embed: false
      - package: WebRTC
        product: WebRTC
        link: true
        embed: false
      - package: libwebp
        product: libwebp
        link: true
        embed: false
      # AVIF photo attachments: libavif 1.4.2 + aom 3.15.1 encoder, a static
      # XCFramework from joswayski/libavif-apple, fetched by prepare.sh (BSD;
      # Resources/libavif-LICENSE.txt, libaom-LICENSE.txt, libaom-PATENTS.txt).
      # Imported implementation-only by CaperCore.
      - framework: .build/libavif-1.4.2/libavif.xcframework
        link: true
        embed: false
      # Shared Rust logic (apps/native/mobile): a static XCFramework that
      # prepare.sh builds with mobile/build-apple.sh. Imported implementation-only.
      - framework: .build/CaperMobile.xcframework
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.core
        PRODUCT_NAME: CaperCore
        PRODUCT_MODULE_NAME: CaperCore
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  CaperRTCBridgeIOS:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CaperRTCBridge/CaperRTCBridgeIOS.h
        headerVisibility: public
      - Sources/CaperRTCBridge/CaperIOSRTCBridge.m
      - path: Sources/CaperRTCBridge/CaperIOSAudioDevice.h
        headerVisibility: public
      - Sources/CaperRTCBridge/CaperIOSAudioDevice.m
      - path: Sources/CaperRTCBridge/CaperVoiceNoteProcessor.h
        headerVisibility: public
      - Sources/CaperRTCBridge/CaperVoiceNoteProcessor.m
      - Sources/CaperRTCBridge/CaperDpdfnet.cpp
      - Sources/CaperRTCBridge/CaperDenoisePipeline.cpp
      - Sources/CaperRTCBridge/CaperVoiceDSP.c
      - .build/rnnoise/src/denoise.c
      - .build/rnnoise/src/rnn.c
      - .build/rnnoise/src/pitch.c
      - .build/rnnoise/src/kiss_fft.c
      - .build/rnnoise/src/celt_lpc.c
      - .build/rnnoise/src/nnet.c
      - .build/rnnoise/src/nnet_default.c
      - .build/rnnoise/src/parse_lpcnet_weights.c
      - .build/rnnoise/src/rnnoise_data.c
      - .build/rnnoise/src/rnnoise_tables.c
      - path: Sources/CaperRTCBridge/sdk
        buildPhase: none
      - path: ../../web/public/audio/dpdfnet8-v2/dpdfnet8_48khz_hr.onnx
        buildPhase: resources
      - path: ../../web/public/audio/dpdfnet8-v2/LICENSE-APACHE-2.0
        buildPhase: resources
      - path: .build/onnxruntime-ios-1.23.2/LICENSE
        buildPhase: resources
      - path: .build/onnxruntime-ios-1.23.2/ThirdPartyNotices.txt
        buildPhase: resources
      - path: .build/rnnoise/COPYING
        buildPhase: resources
    dependencies:
      - package: WebRTC
        product: WebRTC
        link: true
        embed: false
      - framework: .build/onnxruntime-ios-1.23.2/onnxruntime.xcframework
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.rtc-bridge-ios
        PRODUCT_MODULE_NAME: CaperRTCBridgeIOS
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Sources/CaperRTCBridge $(SRCROOT)/.build/onnxruntime-ios-1.23.2/Headers $(SRCROOT)/.build/rnnoise/include $(SRCROOT)/.build/rnnoise/src"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) RNNOISE_BUILD=1 DISABLE_DEBUG_FLOAT=1"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
  # The AppKit client under the shipping identity: same bundle ID, Info.plist
  # keys, caper:// handler and product name as the retired app, so an existing
  # install keeps its Keychain session, login item and update channel.
  CaperMacAppKit:
    type: application
    platform: macOS
    sources:
      - Sources/CaperAppKit
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: CaperCoreMacOS
      - target: CaperRTCBridge
        embed: true
      - framework: .build/onnxruntime-osx-universal2-1.23.2/lib/libonnxruntime.1.23.2.dylib
        link: false
        embed: true
        codeSign: true
      - package: WebRTC
        product: WebRTC
        link: true
    info:
      path: Configuration/macOS-AppKit-Info.plist
      properties:
        CFBundleDisplayName: Caper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CaperSourceRevision: $(CAPER_SOURCE_REVISION)
        CaperVersion: $(CAPER_VERSION)
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: Caper uses your microphone when you join a voice channel or record a voice message.
        ATSApplicationFontsPath: .
        CFBundleURLTypes:
          - CFBundleURLName: chat.caper.invite
            CFBundleURLSchemes: [caper]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPER_MACOS_BUNDLE_ID)
        PRODUCT_NAME: Caper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # System controls (sliders, pop-up buttons, text selection) take terracotta
        # instead of blue while the system accent is Multicolour, the default.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: CaperAccent
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  # The UIKit iPhone client under the shipping identity: the original bundle ID,
  # entitlements (push, communication notifications, associated domains),
  # notification service extension and Info.plist keys, so it can replace the
  # SwiftUI app in TestFlight and an installed copy keeps its Keychain session.
  # build.sh and upload-testflight.sh always build it.
  CaperIOSUIKit:
    type: application
    platform: iOS
    sources:
      - Sources/CaperUIKit
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: CaperCoreIOS
      - target: CaperRTCBridgeIOS
        embed: true
      - target: CaperNotificationService
        embed: true
      - package: WebRTC
        product: WebRTC
        link: true
    info:
      path: Configuration/iOS-UIKit-Info.plist
      properties:
        CFBundleDisplayName: Caper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CaperSourceRevision: $(CAPER_SOURCE_REVISION)
        CaperVersion: $(CAPER_VERSION)
        NSCameraUsageDescription: Caper uses your camera when you take a photo or video to attach to a message.
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Caper uses your microphone when you join a voice channel, record a voice message or record a video to attach.
        NSPhotoLibraryAddUsageDescription: Caper saves photos and videos you choose to your library.
        NSPhotoLibraryUsageDescription: Caper shows your recent photos and videos so you can attach them to messages. Only items you choose are uploaded.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        CaperAPNsEnvironment: $(CAPER_APNS_ENVIRONMENT)
        CFBundleURLTypes:
          - CFBundleURLName: chat.caper.invite
            CFBundleURLSchemes: [caper]
        NSUserActivityTypes: [INSendMessageIntent]
        UIAppFonts: [Figtree-Regular.ttf, Figtree-Medium.ttf, Figtree-Bold.ttf, Figtree-Black.ttf, BricolageGrotesque-Bold.ttf, BricolageGrotesque-ExtraBold.ttf]
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPER_IOS_BUNDLE_ID)
        PRODUCT_NAME: Caper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      configs:
        Debug:
          CAPER_APNS_ENVIRONMENT: development
          CODE_SIGN_ENTITLEMENTS: Configuration/iOS-Debug.entitlements
        Release:
          CAPER_APNS_ENVIRONMENT: production
          CODE_SIGN_ENTITLEMENTS: Configuration/iOS-Release.entitlements
  CaperNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - Sources/CaperNotificationService
      - Sources/CaperCore/NotificationAttachment.swift
      - path: Sources/CaperCore/CaperAvatars.xcassets
        buildPhase: resources
    info:
      path: Configuration/NotificationService-Info.plist
      properties:
        CFBundleDisplayName: Caper Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPER_IOS_BUNDLE_ID).notifications
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  CaperCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/CaperCoreTests
    dependencies:
      - target: CaperCoreMacOS
      - target: CaperRTCBridge
      - framework: .build/onnxruntime-osx-universal2-1.23.2/lib/libonnxruntime.1.23.2.dylib
        link: false
        embed: true
        codeSign: true
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.core-tests
        GENERATE_INFOPLIST_FILE: YES
  CaperIOSCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/CaperIOSCoreTests
      - Tests/CaperCoreTests/AvatarTests.swift
      - Tests/CaperCoreTests/GatewayLifecycleTests.swift
      - Tests/CaperCoreTests/ReactorSummaryTests.swift
      - Tests/CaperCoreTests/EmojiAutocompleteTests.swift
      - Tests/CaperCoreTests/MentionAutocompleteTests.swift
      - Tests/CaperCoreTests/PeopleSuggestionsTests.swift
      - Tests/CaperCoreTests/MentionCardTests.swift
      - Tests/CaperCoreTests/MessageRequestsTests.swift
      - Tests/CaperCoreTests/NotificationSettingsTests.swift
      - Tests/CaperCoreTests/FriendlyErrorTests.swift
      - Tests/CaperCoreTests/InviteLinksTests.swift
      - Tests/CaperCoreTests/MessageLinksTests.swift
      - Tests/CaperCoreTests/MessageFormattingTests.swift
      - Tests/CaperCoreTests/DraftLinkTests.swift
      - Tests/CaperCoreTests/FileDropTests.swift
      - Tests/CaperCoreTests/AttachmentEditTests.swift
      - Tests/CaperCoreTests/AttachmentTests.swift
      - Tests/CaperCoreTests/MessageGroupingTests.swift
      - Tests/CaperCoreTests/MessageArrivalsTests.swift
      - Tests/CaperCoreTests/CodeResendTests.swift
      - Tests/CaperCoreTests/MediaViewerTests.swift
      - Tests/CaperCoreTests/WhatsNewTests.swift
      - Tests/CaperCoreTests/ProfilePictureTests.swift
      - Tests/CaperCoreTests/ProfileUpdatesTests.swift
      - Tests/CaperCoreTests/LiveNowTests.swift
      - Tests/CaperCoreTests/VoiceMessageTests.swift
    dependencies:
      - target: CaperCoreIOS
      - target: CaperRTCBridgeIOS
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.ios-core-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CaperMacAppKit:
    build:
      targets:
        CaperMacAppKit: all
        CaperCoreTests: [test]
    test:
      targets: [CaperCoreTests]
  CaperIOSUIKit:
    build:
      targets:
        CaperIOSUIKit: all
        CaperIOSCoreTests: [test]
    test:
      targets: [CaperIOSCoreTests]
