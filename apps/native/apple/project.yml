name: CaperApple
options:
  bundleIdPrefix: chat.caper
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CaperRTCBridge:
    type: framework
    platform: macOS
    sources:
      - path: Sources/CaperRTCBridge/CaperRTCBridge.h
        headerVisibility: public
      - path: Sources/CaperRTCBridge/CaperRTCBridge.m
      - path: Sources/CaperRTCBridge/sdk
        buildPhase: none
    dependencies:
      - package: WebRTC
        product: WebRTC
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.rtc-bridge
        PRODUCT_MODULE_NAME: CaperRTCBridge
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Sources/CaperRTCBridge"
  CaperCoreMacOS:
    type: framework
    platform: macOS
    sources: Sources/CaperCore
    dependencies:
      - target: CaperRTCBridge
        embed: false
      - package: WebRTC
        product: WebRTC
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.core
        PRODUCT_NAME: CaperCore
        PRODUCT_MODULE_NAME: CaperCore
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  CaperCoreIOS:
    type: framework
    platform: iOS
    sources: Sources/CaperCore
    dependencies:
      - package: WebRTC
        product: WebRTC
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.core
        PRODUCT_NAME: CaperCore
        PRODUCT_MODULE_NAME: CaperCore
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  CaperMacOS:
    type: application
    platform: macOS
    sources:
      - Sources/CaperMacOS
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: CaperCoreMacOS
      - target: CaperRTCBridge
        embed: true
      - package: WebRTC
        product: WebRTC
        link: true
    info:
      path: Configuration/macOS-Info.plist
      properties:
        CFBundleDisplayName: Caper
        NSMicrophoneUsageDescription: Caper uses your microphone when you join a voice channel.
        ATSApplicationFontsPath: .
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPER_MACOS_BUNDLE_ID)
        PRODUCT_NAME: Caper
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  CaperIOS:
    type: application
    platform: iOS
    sources:
      - Sources/CaperIOS
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: CaperCoreIOS
      - package: WebRTC
        product: WebRTC
        link: true
    info:
      path: Configuration/iOS-Info.plist
      properties:
        CFBundleDisplayName: Caper
        NSMicrophoneUsageDescription: Caper uses your microphone when you join a voice channel.
        UIAppFonts: [Satoshi-Regular.otf, Satoshi-Medium.otf, Satoshi-Bold.otf, Satoshi-Black.otf]
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPER_IOS_BUNDLE_ID)
        PRODUCT_NAME: Caper
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  CaperCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests/CaperCoreTests
    dependencies:
      - target: CaperCoreMacOS
      - target: CaperRTCBridge
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.core-tests
        GENERATE_INFOPLIST_FILE: YES
  CaperMacOSParityTests:
    type: bundle.ui-testing
    platform: macOS
    sources: Tests/CaperParityUITests
    dependencies:
      - target: CaperMacOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.macos-parity-tests
        GENERATE_INFOPLIST_FILE: YES
  CaperIOSParityTests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/CaperParityUITests
    dependencies:
      - target: CaperIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.ios-parity-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CaperMacOS:
    build:
      targets:
        CaperMacOS: all
        CaperCoreTests: [test]
    test:
      targets: [CaperCoreTests]
  CaperIOS:
    build:
      targets:
        CaperIOS: all
  CaperMacOSParityTests:
    build:
      targets:
        CaperMacOS: all
        CaperMacOSParityTests: [test]
    test:
      targets: [CaperMacOSParityTests]
  CaperIOSParityTests:
    build:
      targets:
        CaperIOS: all
        CaperIOSParityTests: [test]
    test:
      targets: [CaperIOSParityTests]
