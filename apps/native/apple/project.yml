name: CaperApple
options:
  bundleIdPrefix: chat.caper
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
  # Lossless WebP attachments (BSD; Resources/libwebp-LICENSE.txt). Static,
  # imported implementation-only by CaperCore.
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode.git
    exactVersion: 1.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Every bundle, including embedded frameworks, needs both versions for App
    # Store validation; release.yml overrides both per release (CAPER_BUILD_NUMBER).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  CaperRTCBridge:
    type: framework
    platform: macOS
    sources:
      - path: Sources/CaperRTCBridge/CaperRTCBridge.h
        headerVisibility: public
      - path: Sources/CaperRTCBridge/CaperRTCBridge.m
      - path: Sources/CaperRTCBridge/CaperMacAudioDevice.h
        headerVisibility: public
      - path: Sources/CaperRTCBridge/CaperMacAudioDevice.m
      - path: Sources/CaperRTCBridge/CaperDpdfnet.cpp
      - path: Sources/CaperRTCBridge/CaperDpdfnet.h
        headerVisibility: project
      - path: Sources/CaperRTCBridge/CaperDenoisePipeline.cpp
      - path: Sources/CaperRTCBridge/CaperDenoisePipeline.h
        headerVisibility: project
      - path: Sources/CaperRTCBridge/CaperVoiceDSP.c
      - path: Sources/CaperRTCBridge/CaperVoiceDSP.h
        headerVisibility: project
      - .build/rnnoise/src/denoise.c
      - .build/rnnoise/src/rnn.c
      - .build/rnnoise/src/pitch.c
      - .build/rnnoise/src/kiss_fft.c
      - .build/rnnoise/src/celt_lpc.c
      - .build/rnnoise/src/nnet.c
      - .build/rnnoise/src/nnet_default.c
      - .build/rnnoise/src/parse_lpcnet_weights.c
      - .build/rnnoise/src/rnnoise_data.c
      - .build/rnnoise/src/rnnoise_tables.c
      - path: Sources/CaperRTCBridge/sdk
        buildPhase: none
      - path: ../../web/public/audio/dpdfnet8-v2/dpdfnet8_48khz_hr.onnx
        buildPhase: resources
      - path: ../../web/public/audio/dpdfnet8-v2/LICENSE-APACHE-2.0
        buildPhase: resources
      - path: .build/onnxruntime-osx-universal2-1.23.2/LICENSE
        buildPhase: resources
      - path: .build/onnxruntime-osx-universal2-1.23.2/ThirdPartyNotices.txt
        buildPhase: resources
      - path: .build/rnnoise/COPYING
        buildPhase: resources
    dependencies:
      - package: WebRTC
        product: WebRTC
        link: true
        embed: false
      - framework: .build/onnxruntime-osx-universal2-1.23.2/lib/libonnxruntime.1.23.2.dylib
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.rtc-bridge
        PRODUCT_MODULE_NAME: CaperRTCBridge
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Sources/CaperRTCBridge $(SRCROOT)/.build/onnxruntime-osx-universal2-1.23.2/include $(SRCROOT)/.build/rnnoise/include $(SRCROOT)/.build/rnnoise/src"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/.build/onnxruntime-osx-universal2-1.23.2/lib"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) RNNOISE_BUILD=1 DISABLE_DEBUG_FLOAT=1"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
  CaperCoreMacOS:
    type: framework
    platform: macOS
    sources:
      - path: Sources/CaperCore
        excludes: [EmojiAssets, InvitationAssets]
      - path: Sources/CaperCore/EmojiAssets
        buildPhase: resources
      - path: Sources/CaperCore/InvitationAssets
        buildPhase: resources
      - path: ../../web/public/audio/effects
        buildPhase: resources
        excludes: [README.md]
    dependencies:
      - target: CaperRTCBridge
        embed: false
      - package: WebRTC
        product: WebRTC
        link: true
        embed: false
      - package: libwebp
        product: libwebp
        link: true
        embed: false
      # AVIF photo attachments: libavif 1.4.2 + aom 3.15.1 encoder, a static
      # XCFramework from joswayski/libavif-apple, fetched by prepare.sh (BSD;
      # Resources/libavif-LICENSE.txt, libaom-LICENSE.txt, libaom-PATENTS.txt).
      # Imported implementation-only by CaperCore.
      - framework: .build/libavif-1.4.2/libavif.xcframework
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.core
        PRODUCT_NAME: CaperCore
        PRODUCT_MODULE_NAME: CaperCore
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  CaperCoreIOS:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CaperCore
        excludes: [EmojiAssets, InvitationAssets]
      - path: Sources/CaperCore/EmojiAssets
        buildPhase: resources
      - path: Sources/CaperCore/InvitationAssets
        buildPhase: resources
      - path: ../../web/public/audio/effects
        buildPhase: resources
        excludes: [README.md]
    dependencies:
      - target: CaperRTCBridgeIOS
        embed: false
      - package: WebRTC
        product: WebRTC
        link: true
        embed: false
      - package: libwebp
        product: libwebp
        link: true
        embed: false
      # AVIF photo attachments: libavif 1.4.2 + aom 3.15.1 encoder, a static
      # XCFramework from joswayski/libavif-apple, fetched by prepare.sh (BSD;
      # Resources/libavif-LICENSE.txt, libaom-LICENSE.txt, libaom-PATENTS.txt).
      # Imported implementation-only by CaperCore.
      - framework: .build/libavif-1.4.2/libavif.xcframework
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.core
        PRODUCT_NAME: CaperCore
        PRODUCT_MODULE_NAME: CaperCore
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
  CaperRTCBridgeIOS:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CaperRTCBridge/CaperRTCBridgeIOS.h
        headerVisibility: public
      - Sources/CaperRTCBridge/CaperIOSRTCBridge.m
      - path: Sources/CaperRTCBridge/CaperIOSAudioDevice.h
        headerVisibility: public
      - Sources/CaperRTCBridge/CaperIOSAudioDevice.m
      - Sources/CaperRTCBridge/CaperDpdfnet.cpp
      - Sources/CaperRTCBridge/CaperDenoisePipeline.cpp
      - Sources/CaperRTCBridge/CaperVoiceDSP.c
      - .build/rnnoise/src/denoise.c
      - .build/rnnoise/src/rnn.c
      - .build/rnnoise/src/pitch.c
      - .build/rnnoise/src/kiss_fft.c
      - .build/rnnoise/src/celt_lpc.c
      - .build/rnnoise/src/nnet.c
      - .build/rnnoise/src/nnet_default.c
      - .build/rnnoise/src/parse_lpcnet_weights.c
      - .build/rnnoise/src/rnnoise_data.c
      - .build/rnnoise/src/rnnoise_tables.c
      - path: Sources/CaperRTCBridge/sdk
        buildPhase: none
      - path: ../../web/public/audio/dpdfnet8-v2/dpdfnet8_48khz_hr.onnx
        buildPhase: resources
      - path: ../../web/public/audio/dpdfnet8-v2/LICENSE-APACHE-2.0
        buildPhase: resources
      - path: .build/onnxruntime-c-ios-1.23.0/LICENSE
        buildPhase: resources
      - path: .build/onnxruntime-c-ios-1.23.0/ThirdPartyNotices.txt
        buildPhase: resources
      - path: .build/rnnoise/COPYING
        buildPhase: resources
    dependencies:
      - package: WebRTC
        product: WebRTC
        link: true
        embed: false
      - framework: .build/onnxruntime-c-ios-1.23.0/onnxruntime.xcframework
        link: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.rtc-bridge-ios
        PRODUCT_MODULE_NAME: CaperRTCBridgeIOS
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Sources/CaperRTCBridge $(SRCROOT)/.build/onnxruntime-c-ios-1.23.0/Headers $(SRCROOT)/.build/rnnoise/include $(SRCROOT)/.build/rnnoise/src"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) RNNOISE_BUILD=1 DISABLE_DEBUG_FLOAT=1"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
  CaperMacOS:
    type: application
    platform: macOS
    sources:
      - Sources/CaperMacOS
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: CaperCoreMacOS
      - target: CaperRTCBridge
        embed: true
      - framework: .build/onnxruntime-osx-universal2-1.23.2/lib/libonnxruntime.1.23.2.dylib
        link: false
        embed: true
        codeSign: true
      - package: WebRTC
        product: WebRTC
        link: true
    info:
      path: Configuration/macOS-Info.plist
      properties:
        CFBundleDisplayName: Caper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # The self-updater compares this release build number with latest.json.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Caper uses your microphone when you join a voice channel.
        ATSApplicationFontsPath: .
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPER_MACOS_BUNDLE_ID)
        PRODUCT_NAME: Caper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  CaperIOS:
    type: application
    platform: iOS
    sources:
      - Sources/CaperIOS
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: CaperCoreIOS
      - target: CaperRTCBridgeIOS
        embed: true
      - package: WebRTC
        product: WebRTC
        link: true
    info:
      path: Configuration/iOS-Info.plist
      properties:
        CFBundleDisplayName: Caper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # WebRTC links camera APIs, so App Store processing (ITMS-90683) requires
        # a purpose string even though Caper never opens the camera.
        NSCameraUsageDescription: "Caper doesn't use your camera. Its voice calls are built on WebRTC, which includes camera support."
        # Only standard protocols (HTTPS/TLS and WebRTC's DTLS-SRTP), no proprietary
        # crypto: declare exempt so each TestFlight build skips the compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Caper uses your microphone when you join a voice channel.
        CaperAPNsEnvironment: $(CAPER_APNS_ENVIRONMENT)
        UIAppFonts: [Satoshi-Regular.otf, Satoshi-Medium.otf, Satoshi-Bold.otf, Satoshi-Black.otf]
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # iPad multitasking requires all four orientations.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CAPER_IOS_BUNDLE_ID)
        PRODUCT_NAME: Caper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      configs:
        Debug:
          CAPER_APNS_ENVIRONMENT: development
          CODE_SIGN_ENTITLEMENTS: Configuration/iOS-Debug.entitlements
        Release:
          CAPER_APNS_ENVIRONMENT: production
          CODE_SIGN_ENTITLEMENTS: Configuration/iOS-Release.entitlements
  CaperCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/CaperCoreTests
      - Sources/CaperMacOS/AppUpdater.swift
    dependencies:
      - target: CaperCoreMacOS
      - target: CaperRTCBridge
      - framework: .build/onnxruntime-osx-universal2-1.23.2/lib/libonnxruntime.1.23.2.dylib
        link: false
        embed: true
        codeSign: true
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.core-tests
        GENERATE_INFOPLIST_FILE: YES
  CaperIOSCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/CaperIOSCoreTests
      - Tests/CaperCoreTests/AvatarTests.swift
      - Tests/CaperCoreTests/GatewayLifecycleTests.swift
      - Tests/CaperCoreTests/ReactorSummaryTests.swift
      - Tests/CaperCoreTests/EmojiAutocompleteTests.swift
      - Tests/CaperCoreTests/MentionAutocompleteTests.swift
      - Tests/CaperCoreTests/MentionCardTests.swift
      - Tests/CaperCoreTests/MessageRequestsTests.swift
    dependencies:
      - target: CaperCoreIOS
      - target: CaperRTCBridgeIOS
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.ios-core-tests
        GENERATE_INFOPLIST_FILE: YES
  CaperMacOSParityTests:
    type: bundle.ui-testing
    platform: macOS
    sources: Tests/CaperParityUITests
    dependencies:
      - target: CaperMacOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.macos-parity-tests
        GENERATE_INFOPLIST_FILE: YES
  CaperIOSParityTests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests/CaperParityUITests
    dependencies:
      - target: CaperIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.ios-parity-tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CaperMacOS:
    build:
      targets:
        CaperMacOS: all
        CaperCoreTests: [test]
    test:
      targets: [CaperCoreTests]
  CaperIOS:
    build:
      targets:
        CaperIOS: all
        CaperIOSCoreTests: [test]
    test:
      targets: [CaperIOSCoreTests]
  CaperMacOSParityTests:
    build:
      targets:
        CaperMacOS: all
        CaperMacOSParityTests: [test]
    test:
      targets: [CaperMacOSParityTests]
  CaperIOSParityTests:
    build:
      targets:
        CaperIOS: all
        CaperIOSParityTests: [test]
    test:
      targets: [CaperIOSParityTests]
