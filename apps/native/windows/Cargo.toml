[package]
name = "caper-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Native Windows Caper client (Win32, DirectComposition, Direct2D, DirectWrite, UI Automation)"
publish = false

# A member of the desktop workspace (../desktop/Cargo.toml) like caper-client.
# ../desktop/build.ps1 ships it in the Windows release as Caper.exe.
workspace = "../desktop"

[features]
# rav1e's x86-64 assembly for AVIF photo encoding (needs NASM at build time);
# release builds enable it, as for egui.
avif-asm = ["caper-client/avif-asm"]

[build-dependencies]
winresource = "0.1"

[dependencies]
caper-client = { path = "../client" }
# Link preview players: egui's WebView2 configuration and play-page rules.
caper-web-player = { path = "../desktop/web-player", features = ["engine"] }
raw-window-handle = "0.6"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Pasted pictures: a clipboard DIB becomes the PNG that is uploaded.
image = { version = "0.25.10", default-features = false, features = ["png", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads the egui client's saved audio choices (eframe's app.ron) once.
ron = "0.12"
uuid = { version = "1.18", features = ["v4"] }
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
] }

[lints.rust]
# Win32, COM and Direct2D calls are all unsafe; everything else stays safe.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "allow", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"
