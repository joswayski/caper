[package]
name = "native-chat"
version = "0.1.0"
edition = "2024"

# Caper's conversation screen as a fully native Windows app: Win32 + DirectComposition +
# Direct2D + DirectWrite + UI Automation, with retained composition layers.
[dependencies]
fixture = { path = "../fixture" }
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_Globalization",
] }

[profile.release]
strip = "none"
debug = "line-tables-only"
lto = false
codegen-units = 16

# Standalone: not part of the repository's Cargo workspace.
[workspace]
