name: Update patches
description: >
  Builds caper-updater and makes patch updates to this release's archive from
  the retained earlier builds on the native-update-bases draft release. Never
  fails the release: without bases or a working patch, clients download the
  full archive.
inputs:
  platform:
    description: Updater platform, e.g. linux-x64.
    required: true
  archive:
    description: This release's full archive.
    required: true
  build:
    description: This release's build number.
    required: true
  output:
    description: Folder for the patches and patches-<platform>.json.
    required: true
  github-token:
    description: Token that can read draft releases (contents write).
    required: true
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: 1.99.1
        cache-workspaces: apps/native/updater
    - name: Make patches from retained builds
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PLATFORM: ${{ inputs.platform }}
        ARCHIVE: ${{ inputs.archive }}
        BUILD: ${{ inputs.build }}
        OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        cargo build --manifest-path apps/native/updater/Cargo.toml --locked --release
        bases="$RUNNER_TEMP/update-bases-$PLATFORM"
        mkdir -p "$bases" "$OUTPUT"
        asset="$(basename "$ARCHIVE")"
        gh release download native-update-bases --pattern "*-$asset" --dir "$bases" \
          || echo "::warning::No retained builds to patch from yet; $PLATFORM updates download the full archive."
        python3 scripts/native_update_patches.py generate --platform "$PLATFORM" --archive "$ARCHIVE" \
          --build "$BUILD" --bases "$bases" --updater apps/native/updater/target/release/caper-updater \
          --output "$OUTPUT"
        rm -rf "$bases"
