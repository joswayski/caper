name: Rust for the mobile apps
description: >-
  Installs the pinned Rust toolchain and targets that build the shared mobile
  library (apps/native/mobile): every Android ABI plus cargo-ndk, or every
  Apple slice of CaperMobile.xcframework.
inputs:
  platform:
    description: android or apple.
    required: true
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: 1.99.1
        target: ${{ inputs.platform == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android' || 'aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin' }}
        cache-workspaces: apps/native/mobile
        # Only main uploads caches; other refs restore main's.
        cache-save-if: ${{ github.ref == 'refs/heads/main' }}
    - if: inputs.platform == 'android'
      shell: bash
      run: cargo install cargo-ndk --locked --version 4.1.2
