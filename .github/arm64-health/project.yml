name: AXMenuDiagnostic
options:
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: '-'
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_APP_SANDBOX: NO
targets:
  AXMenuControl:
    type: application
    platform: macOS
    sources: [AXMenuControl.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.diagnostic.ax-menu
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
  AXMenuTests:
    type: bundle.ui-testing
    platform: macOS
    sources: [AXMenuTests.swift]
    dependencies:
      - target: AXMenuControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.caper.diagnostic.ax-menu.tests
schemes:
  AXMenuDiagnostic:
    build:
      targets:
        AXMenuControl: all
        AXMenuTests: [test]
    test:
      targets: [AXMenuTests]
      systemAttachmentLifetime: keepAlways
      userAttachmentLifetime: keepAlways
      preferredScreenCaptureFormat: screenRecording
