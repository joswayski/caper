# NEVER MERGE. Preparation is inactive; execution needs separate exact-pin approval.
name: ARM64 observation-only display inventory
on:
  push:
    branches: [apple-arm64-health-sidebar-run]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify all inputs
        run: shasum -a 256 -c .github/arm64-health/inputs.sha256
      - name: Exact provenance and observation-only display inventory
        timeout-minutes: 5
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/arm64-health/run.py display-inventory "$RUNNER_TEMP/arm64-display"
      - name: Retain raw inventory even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-display-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arm64-display
          if-no-files-found: error
          retention-days: 14
