# NEVER MERGE. Inactive preparation; a new execution ref needs explicit approval.
# Same VM: standalone controls must pass before checkout/setup/build of Caper.
name: Combined AppKit macOS 26 gated acceptance
on:
  push:
    branches: [apple-combined-macos26-run]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify unchanged published input and harness
        run: shasum -a 256 -c .github/canvas-control/inputs.sha256
      - name: Gate every Caper operation on all three standalone controls
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/canvas-control/run.py "$RUNNER_TEMP/canvas-evidence"
      - uses: actions/checkout@v4
        with:
          ref: 5910cfa98ee038fe53204b333c7065879f29a9ba
          path: caper
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/mobile-rust
        with:
          platform: apple
      - name: Verify combined source and restore exact existing dependency
        working-directory: caper
        run: |
          test "$(git rev-parse HEAD)" = 5910cfa98ee038fe53204b333c7065879f29a9ba
          test "$(git rev-parse 'HEAD^{tree}')" = 8793de8321c788ce41587b97104971f805433000
          git diff --exit-code
          # Read only the already-pinned dependency; never adopt its workflow.
          git fetch --no-tags --depth=1 origin 2c029e164956f74c1e98e859b6aa414a3924bdb6
          mkdir -p apps/native/apple/.build/rnnoise
          git show 2c029e164956f74c1e98e859b6aa414a3924bdb6:.github/probe-inputs/rnnoise-model.tar.gz > apps/native/apple/.build/rnnoise-model.tar.gz
          echo '0a8755f8e2d834eff6a54714ecc7d75f9932e845df35f8b59bc52a7cfe6e8b37  apps/native/apple/.build/rnnoise-model.tar.gz' | shasum -a 256 -c -
          curl -fLsS 'https://github.com/xiph/rnnoise/archive/70f1d256acd4b34a572f999a05c87bf00b67730d.tar.gz' -o apps/native/apple/.build/rnnoise-source.tar.gz
          echo 'f61ee0b3f4c4cd337303e003d333357c5eaf25ef5d75a742109ee59e9a0a3932  apps/native/apple/.build/rnnoise-source.tar.gz' | shasum -a 256 -c -
          tar -xzf apps/native/apple/.build/rnnoise-source.tar.gz -C apps/native/apple/.build/rnnoise --strip-components=1
          tar -xzf apps/native/apple/.build/rnnoise-model.tar.gz -C apps/native/apple/.build/rnnoise src/rnnoise_data.c src/rnnoise_data.h
      - name: Build and run the bounded combined acceptance scope
        working-directory: caper
        run: python3 ../.github/canvas-control/native_acceptance.py "$RUNNER_TEMP/combined-evidence" "$RUNNER_TEMP/canvas-evidence"
      - name: Preserve standalone evidence even on a closed gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos26-controls-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canvas-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Preserve all combined results, including successful recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos26-combined-5910cfa9-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/combined-evidence
          if-no-files-found: warn
          retention-days: 14
