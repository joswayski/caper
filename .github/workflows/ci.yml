name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test --workspace @caper/web

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  account-database:
    name: Accounts and durable chat (Postgres + Valkey)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:local-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - name: Start cluster-mode Valkey for chat
        # A single primary owns all slots, enforcing CROSSSLOT rules like the
        # virtual shard exposed by ElastiCache Serverless (not an HA test).
        run: |
          docker run --detach --name chat-valkey --publish 127.0.0.1:6379:6379 \
            valkey/valkey:9.1.2-alpine valkey-server --cluster-enabled yes \
            --bind 0.0.0.0 --protected-mode no
          for attempt in {1..30}; do
            if docker exec chat-valkey valkey-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
          docker exec chat-valkey sh -c 'valkey-cli cluster addslots $(seq 0 16383)' | grep -qx OK
          for attempt in {1..30}; do
            if docker exec chat-valkey valkey-cli cluster info | grep -q 'cluster_state:ok'; then break; fi
            sleep 1
          done
          docker exec chat-valkey valkey-cli cluster info | grep -q 'cluster_state:ok'
      - run: CHAT_TEST_DATABASE_URL="$DATABASE_URL" CHAT_TEST_VALKEY_URL=redis://127.0.0.1:6379 TEST_VALKEY_URL=redis://127.0.0.1:6379 cargo test --locked -p caper-api -- --ignored --skip tests::shared

  shared-media:
    name: Cross-pod media (Valkey)
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
      - run: cargo test --locked -p caper-api tests::shared -- --ignored
