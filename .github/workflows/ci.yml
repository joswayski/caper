name: CI

# Runs on main only; pull requests get no CI. Use "Run workflow" to test a branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# The running build always finishes and only the newest waiting push runs next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    uses: ./.github/workflows/mac-route.yml
    secrets: inherit

  frontend:
    needs: route
    name: Frontend
    runs-on: ${{ needs.route.outputs.linux == 'true' && fromJSON('["self-hosted","joselinux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  rust:
    needs: route
    name: Rust
    runs-on: ${{ needs.route.outputs.linux == 'true' && fromJSON('["self-hosted","joselinux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          # Pull requests restore main's cache but do not upload their own.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      # Clippy type-checks every workspace target (a superset of
      # `cargo check --workspace --all-targets`), so no separate check step.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  account-database:
    needs: route
    name: Accounts and durable chat (Postgres + Valkey)
    runs-on: ${{ needs.route.outputs.linux == 'true' && fromJSON('["self-hosted","joselinux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:local-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start cluster-mode Valkey for chat
        # A single primary owns all slots, enforcing CROSSSLOT rules like the
        # virtual shard exposed by ElastiCache Serverless (not an HA test).
        run: |
          # Self-hosted runners keep their Docker containers between jobs.
          docker rm --force chat-valkey 2>/dev/null || true
          docker run --detach --name chat-valkey --publish 127.0.0.1:6379:6379 \
            valkey/valkey:9.1.2-alpine valkey-server --cluster-enabled yes \
            --bind 0.0.0.0 --protected-mode no
          for attempt in {1..30}; do
            if docker exec chat-valkey valkey-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
          docker exec chat-valkey sh -c 'valkey-cli cluster addslots $(seq 0 16383)' | grep -qx OK
          for attempt in {1..30}; do
            if docker exec chat-valkey valkey-cli cluster info | grep -q 'cluster_state:ok'; then break; fi
            sleep 1
          done
          docker exec chat-valkey valkey-cli cluster info | grep -q 'cluster_state:ok'
      - run: CHAT_TEST_DATABASE_URL="$DATABASE_URL" CHAT_TEST_VALKEY_URL=redis://127.0.0.1:6379 TEST_VALKEY_URL=redis://127.0.0.1:6379 FORWARD_TEST_VALKEY_URL=redis://127.0.0.1:6379 cargo test --locked -p caper-api -- --ignored --skip tests::shared
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  shared-media:
    needs: route
    name: Cross-pod media (Valkey)
    runs-on: ${{ needs.route.outputs.linux == 'true' && fromJSON('["self-hosted","joselinux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    services:
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p caper-api tests::shared -- --ignored
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  native-contracts:
    name: Python tooling and native contracts
    needs: route
    runs-on: ${{ needs.route.outputs.linux == 'true' && fromJSON('["self-hosted","joselinux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: pyproject.toml
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m unittest discover -s tests -p 'test_*.py' -v
      - run: uv run --locked python shared/fonts/test_native_fonts.py -v
      - name: Verify bundled Apple emoji match the shared artwork and licenses
        run: diff -qr shared/emoji apps/native/apple/Sources/CaperCore/EmojiAssets
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  updater:
    name: Native updater / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    needs: route
    runs-on: ${{ needs.route.outputs.mac == 'true' && matrix.os == 'macos-15' && fromJSON('["self-hosted","josemac"]') || needs.route.outputs.windows == 'true' && startsWith(matrix.os, 'windows') && fromJSON('["self-hosted","josewin"]') || needs.route.outputs.linux == 'true' && startsWith(matrix.os, 'ubuntu') && fromJSON('["self-hosted","joselinux"]') || matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: apps/native/updater
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          cache-workspaces: apps/native/updater
          # Pull requests restore main's cache but do not upload their own.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"
