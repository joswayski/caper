name: AWS image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - vitest.config.ts
      - apps/web/**
      - shared/**
      - .github/workflows/aws-image.yml

permissions:
  contents: read

# Runs on main only. Each push gets a unique group (the run id), so publishing
# is never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    uses: ./.github/workflows/mac-route.yml
    secrets: inherit

  # Builds and tests the image on the Mac's arm64 Linux VM when mac-route.yml
  # picks it, and hands the tested image to the publish job, which runs on
  # GitHub so the ECR role never reaches a self-hosted machine.
  image-arm64:
    name: linux/arm64 image
    needs: route
    runs-on: ${{ needs.route.outputs.linux_arm == 'true' && fromJSON('["self-hosted","joselinux-arm"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners start empty, so they build in a BuildKit container
      # backed by GitHub's layer cache. Self-hosted runners use their own Docker
      # daemon, whose layer cache stays on the machine.
      - if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: caper-web:arm64
          cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha' || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,mode=max' || '' }}
      - name: Assert linux/arm64 image and runtime
        run: |
          set -euo pipefail
          test "$(docker image inspect caper-web:arm64 --format '{{.Os}}')" = linux
          test "$(docker image inspect caper-web:arm64 --format '{{.Architecture}}')" = arm64
          test "$(docker run --rm --platform linux/arm64 --entrypoint uname caper-web:arm64 -m)" = aarch64
      - name: Verify health endpoint
        run: |
          set -euo pipefail
          container="$(docker run --detach --platform linux/arm64 --publish 3000:3000 caper-web:arm64)"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent http://127.0.0.1:3000/health 2>/dev/null || true)"
            [[ "$response" == '{"status":"ok"}' ]] && exit 0
            sleep 1
          done
          docker logs "$container"
          exit 1
      - name: Export the tested image
        run: |
          set -euo pipefail
          docker save caper-web:arm64 | gzip -1 > "$RUNNER_TEMP/caper-web.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: caper-web-image
          path: ${{ runner.temp }}/caper-web.tar.gz
          retention-days: 1
          compression-level: 0

  publish-ecr:
    name: Publish immutable ECR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      digest: ${{ steps.record.outputs.digest }}
    env:
      AWS_ACCOUNT_ID: "395451633568"
      AWS_REGION: us-east-1
      ECR_REGISTRY: 395451633568.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: production/caper
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::395451633568:role/production-caper-ecr-publisher
          role-session-name: caper-ecr-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Check for existing immutable tag
        id: existing
        run: |
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'exists=true\ndigest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          name: caper-web-image
          path: ${{ runner.temp }}
      - name: Load the tested image
        if: steps.existing.outputs.exists != 'true'
        run: docker load --input "$RUNNER_TEMP/caper-web.tar.gz"
      - name: Log in to Amazon ECR
        if: steps.existing.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2.1.6
      - name: Push the tested linux/arm64 image
        id: push
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          docker tag caper-web:arm64 "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Record immutable image
        id: record
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.existing.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$DIGEST" >> "$GITHUB_OUTPUT"
          printf '### Published image\n\n`%s/%s:%s@%s`\n' "$ECR_REGISTRY" "$ECR_REPOSITORY" "$GITHUB_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Notify deployment webhook
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DEPLOY_NOTIFICATION_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK_URL }}
          DEPLOY_WORKFLOW_URL: https://github.com/joswayski/infrastructure/actions/workflows/deploy-caper-web.yml
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.record.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_NOTIFICATION_WEBHOOK_URL" ]]; then
            echo "DEPLOY_NOTIFICATION_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          commit_title="${COMMIT_MESSAGE%%$'\n'*}"
          commit_body=""
          if [[ "$COMMIT_MESSAGE" == *$'\n'* ]]; then
            commit_body="${COMMIT_MESSAGE#*$'\n'}"
          fi

          if pull_requests="$(curl --fail --show-error --silent \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=1")" && \
            pull_request="$(jq -cer '.[0] | select(type == "object") | {title, body}' <<< "$pull_requests")"; then
            commit_title="$(jq -r '.title // ""' <<< "$pull_request")"
            commit_body="$(jq -r '.body // ""' <<< "$pull_request")"
          fi

          payload="$(jq -cn \
            --arg git_sha "$GITHUB_SHA" \
            --arg digest "$IMAGE_DIGEST" \
            --arg deploy_url "$DEPLOY_WORKFLOW_URL" \
            --arg commit_title "$commit_title" \
            --arg commit_body "$commit_body" \
            'def truncate_field:
              if length > 1024 then .[:1021] + "..." else . end;
            ($commit_title | rtrimstr("\r") | truncate_field) as $title |
            ($commit_body | split("\n") | map(rtrimstr("\r")) | join("\n")
              | sub("^([ \\t]*\\n)+"; "")
              | sub("(\\n[ \\t]*)+$"; "")) as $body |
            {
              username: "Production deploys",
              embeds: [{
                author: {name: "Caper web image is ready"},
                title: $title,
                color: 11947296,
                fields: ((if $body | test("[^[:space:]]") then
                  [{name: "Description", value: ($body | truncate_field), inline: false}]
                else [] end) + [
                  {name: "Git SHA", value: ("`" + $git_sha + "`"), inline: false},
                  {name: "Digest", value: ("`" + $digest + "`"), inline: false}
                ])
              }],
              components: [{type: 1, components: [
                {type: 2, style: 3, label: "Deploy Caper web", custom_id: ("production-deploy:v1:caper-web:" + $git_sha)},
                {type: 2, style: 5, label: "Open GitHub", url: $deploy_url}
              ]}]
            }')"
          curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 10 \
            --header 'Content-Type: application/json' --data "$payload" \
            "${DEPLOY_NOTIFICATION_WEBHOOK_URL}?wait=false&with_components=true"
