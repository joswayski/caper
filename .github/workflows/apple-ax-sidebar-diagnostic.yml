# NEVER MERGE. Preparation branch is inactive. Execution needs separate approval.
name: Isolated AppKit AX and sidebar diagnostics
on:
  push:
    branches: [apple-macos26-ax-sidebar-run]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: macos-26-intel
    timeout-minutes: 110
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify all diagnostic inputs
        run: shasum -a 256 -c .github/ax-sidebar/inputs.sha256
      - name: Fail closed on image or toolchain drift
        id: provenance
        timeout-minutes: 3
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 .github/ax-sidebar/run.py preflight "$RUNNER_TEMP/ax-sidebar/preflight"
      - name: Standalone ordinary-menu AX check, once
        id: standalone
        timeout-minutes: 25
        continue-on-error: true
        run: python3 .github/ax-sidebar/run.py standalone "$RUNNER_TEMP/ax-sidebar/standalone"
      - uses: actions/checkout@v4
        id: source
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' }}
        with:
          ref: 5910cfa98ee038fe53204b333c7065879f29a9ba
          path: caper
      - uses: ./.github/actions/mobile-rust
        id: rust
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' && steps.source.outcome == 'success' }}
        with:
          platform: apple
      - name: Restore the exact existing RNNoise dependency
        id: dependency
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' && steps.source.outcome == 'success' && steps.rust.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: caper
        run: |
          git fetch --no-tags --depth=1 origin 2c029e164956f74c1e98e859b6aa414a3924bdb6
          mkdir -p apps/native/apple/.build/rnnoise
          git show 2c029e164956f74c1e98e859b6aa414a3924bdb6:.github/probe-inputs/rnnoise-model.tar.gz > apps/native/apple/.build/rnnoise-model.tar.gz
          echo '0a8755f8e2d834eff6a54714ecc7d75f9932e845df35f8b59bc52a7cfe6e8b37  apps/native/apple/.build/rnnoise-model.tar.gz' | shasum -a 256 -c -
          curl --max-time 120 -fLsS 'https://github.com/xiph/rnnoise/archive/70f1d256acd4b34a572f999a05c87bf00b67730d.tar.gz' -o apps/native/apple/.build/rnnoise-source.tar.gz
          echo 'f61ee0b3f4c4cd337303e003d333357c5eaf25ef5d75a742109ee59e9a0a3932  apps/native/apple/.build/rnnoise-source.tar.gz' | shasum -a 256 -c -
          tar -xzf apps/native/apple/.build/rnnoise-source.tar.gz -C apps/native/apple/.build/rnnoise --strip-components=1
          tar -xzf apps/native/apple/.build/rnnoise-model.tar.gz -C apps/native/apple/.build/rnnoise src/rnnoise_data.c src/rnnoise_data.h
      - name: Existing sidebar singleton with observation-only overlay, once
        id: sidebar
        if: ${{ !cancelled() && steps.provenance.outcome == 'success' && steps.dependency.outcome == 'success' }}
        timeout-minutes: 70
        continue-on-error: true
        working-directory: caper
        run: python3 ../.github/ax-sidebar/run.py sidebar "$RUNNER_TEMP/ax-sidebar/sidebar"
      - name: Preserve both independent outcomes; either failure fails the job
        if: always()
        run: python3 .github/ax-sidebar/run.py finalize "$RUNNER_TEMP/ax-sidebar"
      - name: Retain diagnostics, including success AX and both width snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax-sidebar-5910cfa9-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ax-sidebar
            !${{ runner.temp }}/ax-sidebar/standalone/work/XcodeGen
            !${{ runner.temp }}/ax-sidebar/standalone/work/DerivedData
          if-no-files-found: error
          retention-days: 14
