# Formatting-only acceptance of the exact shared repair. Never merge this workflow.
# Publishing apple-formatting-acceptance does not trigger a run.
name: Apple isolated UI clipboard probe
on:
  push:
    branches: [apple-macos15-probe]
    paths: [.github/workflows/apple-ui-clipboard-probe.yml]
jobs:
  clipboard-ui:
    name: Clipboard UI / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: formatting-repair-be6b3452
            source: be6b345248279591320b42094e0a7057094a6ca9
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ matrix.source }}
      SOURCE_TREE: cec93377459b8c312dda54294fadb939f04fb637
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Require a disposable desktop large enough for unchanged wide tests
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -m)" = x86_64
          mkdir -p ui
          # Same Intel VM display setup as native.yml, never Jose's Mac.
          if [[ -x '/Library/Application Support/Veertu/Anka/addons/change_res' ]]; then
            '/Library/Application Support/Veertu/Anka/addons/change_res' 1920x1080x32@30
          elif [[ -x '/Library/Application Support/VMware Tools/vmware-resolutionSet' ]]; then
            '/Library/Application Support/VMware Tools/vmware-resolutionSet' 1920 1080
          fi
          sleep 3
          system_profiler SPDisplaysDataType > ui/display.txt
          swift -e 'import AppKit; let frame = NSScreen.main!.visibleFrame; print("Visible screen: \(frame)"); precondition(frame.width >= 1440 && frame.height >= 900, "Hosted desktop cannot fit the unchanged wide tests")' | tee -a ui/display.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/mobile-rust
        with:
          platform: apple
      - name: Record exact provenance and restore pinned dependency
        run: |
          mkdir -p ui
          sw_vers | tee ui/environment.txt
          xcodebuild -version | tee -a ui/environment.txt
          uname -m | tee -a ui/environment.txt
          git rev-parse HEAD 'HEAD^{tree}' | tee -a ui/environment.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff --exit-code
          shasum -a 256 scripts/native-parity-fixture.mjs apps/native/apple/native-project.yml apps/native/apple/Tests/CaperAppKitTests/CaperAppKitTests.swift > ui/source-hashes.txt
          swift -e 'import AppKit; print("Effective AppKit Keyboard navigation: \(NSApplication.shared.isFullKeyboardAccessEnabled)")' | tee -a ui/environment.txt
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          shasum -a 256 apps/native/apple/Sources/CaperCore/CaperView.swift apps/native/apple/Sources/CaperCore/AppKitHosting.swift apps/native/apple/Tests/CaperAppKitTests/CaperAppKitTests.swift > ui/original-source-hashes.txt
          git diff --exit-code
          mkdir -p apps/native/apple/.build/rnnoise
          git show "$GITHUB_SHA:.github/probe-inputs/rnnoise-model.tar.gz" > apps/native/apple/.build/rnnoise-model.tar.gz
          echo '0a8755f8e2d834eff6a54714ecc7d75f9932e845df35f8b59bc52a7cfe6e8b37  apps/native/apple/.build/rnnoise-model.tar.gz' | shasum -a 256 -c -
          curl -fLsS --retry 6 --retry-delay 5 --retry-all-errors 'https://github.com/xiph/rnnoise/archive/70f1d256acd4b34a572f999a05c87bf00b67730d.tar.gz' -o apps/native/apple/.build/rnnoise-source.tar.gz
          echo 'f61ee0b3f4c4cd337303e003d333357c5eaf25ef5d75a742109ee59e9a0a3932  apps/native/apple/.build/rnnoise-source.tar.gz' | shasum -a 256 -c -
          tar -xzf apps/native/apple/.build/rnnoise-source.tar.gz -C apps/native/apple/.build/rnnoise --strip-components=1
          tar -xzf apps/native/apple/.build/rnnoise-model.tar.gz -C apps/native/apple/.build/rnnoise src/rnnoise_data.c src/rnnoise_data.h
      - name: Accept formatting repair without a source overlay
        continue-on-error: true
        run: |
          git diff --exit-code
          bash apps/native/apple/prepare.sh
          generator=(apps/native/apple/.build/xcodegen-*)
          swift run --package-path "${generator[0]}" xcodegen --spec apps/native/apple/native-project.yml --project apps/native/apple
          node scripts/native-parity-fixture.mjs > ui/fixture.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          for _ in {1..50}; do curl --silent --fail http://127.0.0.1:3001/health >/dev/null && break; sleep .1; done
          curl --silent --fail http://127.0.0.1:3001/health >/dev/null
          tests=(
            testDraftFormattingCopyRepairUndoMenusAndSend
          )
          printf '%s\n' "${tests[@]}" > ui/selected-tests.txt
          # A failed async XCTest continued into the next method in the original
          # run. Separate runner processes keep its assertions from contaminating
          # the next result; each selected method runs once.
          arguments=(-project apps/native/apple/CaperNative.xcodeproj -scheme CaperAppKitTests
            -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath apps/native/apple/DerivedData-UI)
          xcodebuild "${arguments[@]}" build-for-testing 2>&1 | tee ui/build.log
          for test in "${tests[@]}"; do
            directory="ui/$test"
            mkdir -p "$directory"
            set +e
            xcodebuild "${arguments[@]}" -resultBundlePath "$directory/Results.xcresult" \
              -parallel-testing-enabled NO -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 \
              "-only-testing:CaperAppKitTests/CaperAppKitTests/$test" test-without-building 2>&1 | tee "$directory/tests.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "$directory/test-exit-code"
          done
      - name: Export actual results and captures
        if: always()
        run: |
          for bundle in ui/*/Results.xcresult; do
            [[ -d "$bundle" ]] || continue
            directory="$(dirname "$bundle")"
            xcrun xcresulttool get test-results summary --path "$bundle" > "$directory/summary.json"
            xcrun xcresulttool export attachments --path "$bundle" --output-path "$directory/captures"
            xcrun xcresulttool export diagnostics --path "$bundle" --output-path "$directory/diagnostics" > "$directory/export-diagnostics.log" 2>&1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipboard-ui-${{ matrix.name }}
          path: ui/
          retention-days: 7
      - name: Require the exact formatting method without skips
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          path = pathlib.Path('ui')
          expected = set((path / 'selected-tests.txt').read_text().splitlines())
          assert expected == {
              'testDraftFormattingCopyRepairUndoMenusAndSend',
          }, expected
          assert {p.parent.name for p in path.glob('*/summary.json')} == expected
          failures = []
          for name in sorted(expected):
              directory = path / name
              summary = json.loads((directory / 'summary.json').read_text())
              outcomes = re.findall(r"Test Case '-\[CaperAppKitTests\.CaperAppKitTests (\w+)\]' (passed|failed|skipped) \(", (directory / 'tests.log').read_text())
              code = int((directory / 'test-exit-code').read_text())
              passed = (outcomes == [(name, 'passed')] and code == 0
                        and summary['totalTestCount'] == 1 and summary['passedTests'] == 1
                        and summary['failedTests'] == 0 and summary['skippedTests'] == 0)
              print(name, 'exit', code, 'outcomes', outcomes, 'summary', summary)
              if not passed:
                  failures.append(name)
          assert not failures, failures
          PY
