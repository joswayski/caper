# Temporary hosted relocation of queue53's race/control, never merge.
name: Apple workspace race probe
on:
  push:
    branches: [apple-macos15-probe]
    paths: [.github/workflows/apple-race-probe.yml]
jobs:
  race:
    name: Workspace race / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: candidate-50
            source: e4c6f8d264dcbc0945a71ad078189f47343f52b4
            iterations: 50
            selector: CaperCoreTests/APIClientTests/testWorkspaceCompletionAfterLogoutDoesNotStartServicesForNewAccount
            expected: 50
          - name: control-50
            source: 441e0f17e06d0c32467d448f6bebe49a7eccdbe6
            iterations: 50
            selector: CaperCoreTests/APIClientTests/testWorkspaceCompletionAfterLogoutDoesNotStartServicesForNewAccount
            expected: 50
          - name: integrated-api
            source: 3c20b1795581626a96726f212b12a897286fb7e2
            iterations: 1
            selector: CaperCoreTests/APIClientTests
            expected: 94
    runs-on: macos-15
    timeout-minutes: 75
    env:
      SOURCE_SHA: ${{ matrix.source }}
      PROBE_CASE: ${{ matrix.name }}
      EXPECTED_TESTS: ${{ matrix.expected }}
      TEST_SELECTOR: ${{ matrix.selector }}
      ITERATIONS: ${{ matrix.iterations }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/mobile-rust
        with:
          platform: apple
      - name: Assert source and restore pinned model
        run: |
          mkdir -p race
          sw_vers | tee race/environment.txt
          xcodebuild -version | tee -a race/environment.txt
          git rev-parse HEAD | tee -a race/environment.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          mkdir -p apps/native/apple/.build/rnnoise
          git show "$GITHUB_SHA:.github/probe-inputs/rnnoise-model.tar.gz" > apps/native/apple/.build/rnnoise-model.tar.gz
          echo '0a8755f8e2d834eff6a54714ecc7d75f9932e845df35f8b59bc52a7cfe6e8b37  apps/native/apple/.build/rnnoise-model.tar.gz' | shasum -a 256 -c -
          curl -fLsS --retry 6 --retry-delay 5 --retry-all-errors 'https://github.com/xiph/rnnoise/archive/70f1d256acd4b34a572f999a05c87bf00b67730d.tar.gz' -o apps/native/apple/.build/rnnoise-source.tar.gz
          echo 'f61ee0b3f4c4cd337303e003d333357c5eaf25ef5d75a742109ee59e9a0a3932  apps/native/apple/.build/rnnoise-source.tar.gz' | shasum -a 256 -c -
          tar -xzf apps/native/apple/.build/rnnoise-source.tar.gz -C apps/native/apple/.build/rnnoise --strip-components=1
          tar -xzf apps/native/apple/.build/rnnoise-model.tar.gz -C apps/native/apple/.build/rnnoise src/rnnoise_data.c src/rnnoise_data.h
      - name: Run the pinned native tests
        continue-on-error: true
        run: |
          bash apps/native/apple/prepare.sh
          set +e
          xcodebuild -project apps/native/apple/CaperApple.xcodeproj -scheme CaperMacOS \
            -destination 'platform=macOS' -derivedDataPath apps/native/apple/DerivedData-Mac \
            -resultBundlePath race/RaceResults.xcresult \
            "-only-testing:$TEST_SELECTOR" -test-iterations "$ITERATIONS" \
            test CODE_SIGNING_ALLOWED=NO 2>&1 | tee race/tests.log
          status=${PIPESTATUS[0]}
          echo "$status" > race/test-exit-code
          exit "$status"
      - name: Retain actual counts and require completed validation
        if: always()
        run: |
          if [[ -d race/RaceResults.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path race/RaceResults.xcresult > race/summary.json
          fi
          python3 - <<'PY'
          import json, os, pathlib, re
          path = pathlib.Path('race')
          log = (path / 'tests.log').read_text()
          status = int((path / 'test-exit-code').read_text())
          outcomes = re.findall(r"Test Case '-\[CaperCoreTests\.APIClientTests \w+\]' (passed|failed|skipped) \(", log)
          counts = {result: outcomes.count(result) for result in ('passed', 'failed', 'skipped')}
          evidence = dict(source=os.environ['SOURCE_SHA'], case=os.environ['PROBE_CASE'], exit=status, total=len(outcomes), **counts)
          (path / 'counts.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          assert len(outcomes) == int(os.environ['EXPECTED_TESTS']), evidence
          assert counts['skipped'] == 0, evidence
          if os.environ['PROBE_CASE'] == 'control-50':
              # Control failures are observations, never mistaken for a passing test run.
              assert status == (65 if counts['failed'] else 0), evidence
          else:
              assert status == 0 and counts['failed'] == 0, evidence
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-${{ matrix.name }}
          path: race/
          retention-days: 7
