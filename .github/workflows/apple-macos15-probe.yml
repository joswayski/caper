# Temporary probe branch only; never merged. Each isolated hosted runner
# verifies the Audio candidate under one explicitly checked keyboard policy.
name: Apple macOS 15 probe
on:
  push:
    branches: [apple-macos15-probe]
jobs:
  probe:
    name: macOS 15 / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: disabled
            mode: 0
          - name: enabled
            mode: 2
    runs-on: macos-15
    timeout-minutes: 75
    env:
      SOURCE_SHA: 7c8888793f4be8bb66bf9b0e2a64eb4368e17d25
      KEYBOARD_MODE: ${{ matrix.mode }}
      KEYBOARD_POLICY: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/mobile-rust
        with:
          platform: apple
      - name: Assert source and effective keyboard policy
        run: |
          mkdir -p probe
          sw_vers | tee probe/environment.txt
          xcodebuild -version | tee -a probe/environment.txt
          git rev-parse HEAD | tee -a probe/environment.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          # Disposable GitHub host only, never Jose's Mac or simulator queue.
          defaults write -g AppleKeyboardUIMode -int "$KEYBOARD_MODE"
          test "$(defaults read -g AppleKeyboardUIMode)" = "$KEYBOARD_MODE"
          swift -e 'import AppKit; let expected = ProcessInfo.processInfo.environment["KEYBOARD_MODE"] == "2"; let actual = NSApplication.shared.isFullKeyboardAccessEnabled; print("Effective AppKit Keyboard navigation: \(actual), expected: \(expected)"); precondition(actual == expected)' | tee -a probe/environment.txt
      - name: Clear macOS notices off the screen
        run: |
          osascript -e 'quit app "System Settings"' 2>/dev/null || true
          killall NotificationCenter UserNotificationCenter 2>/dev/null || true
          defaults read chat.caper.macos 2>/dev/null | sed -n 's/^ *"\(NSWindow Frame [^"]*\)".*/\1/p' |
            while IFS= read -r key; do defaults delete chat.caper.macos "$key"; done
          sleep 2
      - name: Run Audio and focus regression tests
        continue-on-error: true
        run: |
          set +e
          bash apps/native/apple/parity-screenshots.sh macos \
            -only-testing:CaperMacOSParityTests/CaperParityUITests/testAudioDevicesOpenSeparateChoicesAndDismissWithoutChangingVolume \
            -only-testing:CaperMacOSParityTests/CaperParityUITests/testVoiceEntryAndAudioPreferencesWithoutFeatureFlag \
            -only-testing:CaperMacOSParityTests/CaperParityUITests/testThreadFocusDoesNotOutlineOtherThreadLinks \
            2>&1 | tee probe/tests.log
          status=${PIPESTATUS[0]}
          echo "$status" > probe/test-exit-code
          exit "$status"
      - name: Keep results
        if: always()
        run: |
          mkdir -p probe
          mv apps/native/apple/ParityResults.xcresult probe/ 2>/dev/null || true
          mv apps/native/apple/parity-artifacts probe/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos15-probe-${{ matrix.name }}
          path: probe/
          retention-days: 7
      - name: Require actual test success and intended focus path
        if: always()
        run: |
          test "$(cat probe/test-exit-code)" = 0
          grep -F "Audio menu keyboard navigation: $KEYBOARD_POLICY" probe/tests.log
          grep -F 'Executed 3 tests, with 0 failures' probe/tests.log
