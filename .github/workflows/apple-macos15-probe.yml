# Temporary probe branch only; never merged. Runs the macOS 15 hosted UI
# failures on unchanged main and on the Escape fix, with keyboard navigation
# at the image default and then turned on.
name: Apple macOS 15 probe
on:
  push:
    branches: [apple-macos15-probe]
jobs:
  probe:
    name: macOS 15 / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            ref: 441e0f17ef69da1bc4cbe5f3f08f0bdd81cc8c11
          - name: escape-fix
            ref: b3c4bdf67756a04aaa09502a4717b4ed961196c5
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/mobile-rust
        with:
          platform: apple
      - name: Environment
        run: |
          sw_vers; xcodebuild -version; git rev-parse HEAD
          echo "AppleKeyboardUIMode=$(defaults read -g AppleKeyboardUIMode 2>/dev/null || echo unset)"
      - name: Clear macOS notices off the screen
        run: |
          osascript -e 'quit app "System Settings"' 2>/dev/null || true
          killall NotificationCenter UserNotificationCenter 2>/dev/null || true
          defaults read chat.caper.macos 2>/dev/null | sed -n 's/^ *"\(NSWindow Frame [^"]*\)".*/\1/p' |
            while IFS= read -r key; do defaults delete chat.caper.macos "$key"; done
          sleep 2
      - name: Run with the image's keyboard navigation setting
        continue-on-error: true
        run: |
          bash apps/native/apple/parity-screenshots.sh macos \
            -only-testing:CaperMacOSParityTests/CaperParityUITests/testAudioDevicesOpenSeparateChoicesAndDismissWithoutChangingVolume \
            -only-testing:CaperMacOSParityTests/CaperParityUITests/testVoiceEntryAndAudioPreferencesWithoutFeatureFlag \
            -only-testing:CaperMacOSParityTests/CaperParityUITests/testThreadFocusDoesNotOutlineOtherThreadLinks
      - name: Keep the first result
        if: always()
        run: |
          mkdir -p probe/default
          mv apps/native/apple/ParityResults.xcresult probe/default/ 2>/dev/null || true
          mv apps/native/apple/parity-artifacts probe/default/ 2>/dev/null || true
      - name: Run with keyboard navigation on
        continue-on-error: true
        run: |
          defaults write -g AppleKeyboardUIMode -int 2
          echo "AppleKeyboardUIMode=$(defaults read -g AppleKeyboardUIMode)"
          bash apps/native/apple/parity-screenshots.sh macos \
            -only-testing:CaperMacOSParityTests/CaperParityUITests/testAudioDevicesOpenSeparateChoicesAndDismissWithoutChangingVolume \
            -only-testing:CaperMacOSParityTests/CaperParityUITests/testVoiceEntryAndAudioPreferencesWithoutFeatureFlag
      - name: Keep the second result
        if: always()
        run: |
          mkdir -p probe/keyboard-navigation
          mv apps/native/apple/ParityResults.xcresult probe/keyboard-navigation/ 2>/dev/null || true
          mv apps/native/apple/parity-artifacts probe/keyboard-navigation/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos15-probe-${{ matrix.name }}
          path: probe/
          retention-days: 7
