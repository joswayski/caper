name: Native release

# Signed builds friends can install from stable links:
#   https://github.com/joswayski/caper/releases/download/native-latest/Caper-macOS-Apple-Silicon.zip
#   https://github.com/joswayski/caper/releases/download/native-latest/Caper-macOS-Intel.zip
#   https://github.com/joswayski/caper/releases/download/native-latest/Caper-Android.apk
#   https://github.com/joswayski/caper/releases/download/native-latest/Caper-Windows-x64.zip
#   https://github.com/joswayski/caper/releases/download/native-latest/Caper-Linux-x64.deb
#   https://github.com/joswayski/caper/releases/download/native-latest/Caper-Linux-x64.tar.gz
# and uploads the iPhone app to TestFlight. The Mac, Windows and Linux apps update
# themselves from latest.json (signed with the caper_update key) using
# apps/native/updater; each release's build number is this workflow's run number.
#
# Started from the "Deploy Caper apps" button that native-ready.yml posts to
# Discord (Godis dispatches this workflow with the exact commit and message), or
# by hand from the Actions tab.
# Signing material comes from AWS Secrets Manager (joswayski/infrastructure,
# docs/release-signing.md); none is stored in this repository.
on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Commit to release. Leave blank for the newest main commit.
        required: false
        type: string
        default: ""
      discord_message_id:
        description: Discord notification to update with the result (set by Godis).
        required: false
        type: string
        default: ""
      discord_started_at:
        description: Unix time the Discord release started (set by Godis).
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: native-release
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  RELEASE_SIGNER_ROLE: arn:aws:iam::395451633568:role/production-caper-release-signer
  RELEASE_TAG: native-latest
  # Monotonic, compared by the self-updater. Re-runs rebuild the same number.
  CAPER_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  resolve:
    name: Resolve release commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      update_public_key: ${{ steps.update_key.outputs.public_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: sha
        env:
          REQUESTED_SHA: ${{ inputs.git_sha }}
        run: |
          set -euo pipefail
          sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "git_sha must be a full lowercase 40-character SHA." >&2; exit 1; }
          # Only commits already on main are released.
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA" || { echo "$sha is not on main." >&2; exit 1; }
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "Releasing $sha"
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.RELEASE_SIGNER_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read the update public key
        id: update_key
        # Public, so it may pass between jobs. Until the key is stored
        # (store-release-signing-secrets.sh updates --generate --app caper), desktop builds
        # ship without self-updates rather than failing the release.
        run: |
          set -euo pipefail
          public_key=""
          if secret="$(aws secretsmanager get-secret-value --secret-id production/signing/release \
            --query SecretString --output text 2>/dev/null)"; then
            public_key="$(jq -r '.caper_update.public_key // ""' <<<"$secret")"
          fi
          unset secret
          if [[ -z "$public_key" ]]; then
            echo "::warning::production/signing/release has no caper_update key; these desktop builds cannot self-update."
          else
            [[ "$public_key" =~ ^[A-Za-z0-9+/]{43}=$ ]] || { echo "Stored update public key is malformed." >&2; exit 1; }
          fi
          echo "public_key=$public_key" >>"$GITHUB_OUTPUT"

  macos:
    name: macOS / ${{ matrix.label }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: Apple-Silicon
          - os: macos-15-intel
            label: Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          cache-workspaces: apps/native/updater
      - name: Build the self-updater
        env:
          CAPER_UPDATE_PUBLIC_KEY: ${{ needs.resolve.outputs.update_public_key }}
        run: |
          set -euo pipefail
          [[ -n "$CAPER_UPDATE_PUBLIC_KEY" ]] || unset CAPER_UPDATE_PUBLIC_KEY
          cargo build --manifest-path apps/native/updater/Cargo.toml --locked --release
          echo "CAPER_UPDATER_BINARY=$GITHUB_WORKSPACE/apps/native/updater/target/release/caper-updater" >>"$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.RELEASE_SIGNER_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Import the Developer ID identity and notary key
        run: |
          set -euo pipefail
          secret="$RUNNER_TEMP/apple.json"
          aws secretsmanager get-secret-value --secret-id production/signing/release \
            --query SecretString --output text | jq -e '.apple | objects' >"$secret"
          chmod 0600 "$secret"
          for key in developer_id_p12_base64 developer_id_p12_password; do
            echo "::add-mask::$(jq -r ".$key" "$secret")"
          done
          jq -r .developer_id_p12_base64 "$secret" | base64 --decode >"$RUNNER_TEMP/developer-id.p12"
          jq -r .app_store_connect_private_key "$secret" >"$RUNNER_TEMP/notary.p8"
          chmod 0600 "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          keychain="$RUNNER_TEMP/caper-signing.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$(jq -r .developer_id_p12_password "$secret")" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F\" '/Developer ID Application/{print $2; exit}')"
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity in the stored .p12." >&2; exit 1; }
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$(jq -r .app_store_connect_key_id "$secret")"
            echo "NOTARY_ISSUER=$(jq -r .app_store_connect_issuer_id "$secret")"
            echo "CAPER_SIGNING_KEYCHAIN=$keychain"
          } >>"$GITHUB_ENV"
          rm -f "$secret" "$RUNNER_TEMP/developer-id.p12"
      - name: Build and test
        run: bash apps/native/apple/build.sh macos
      - name: Sign with Developer ID, notarize and staple
        run: bash apps/native/apple/sign-and-notarize.sh "${{ matrix.label }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.label }}
          path: apps/native/apple/dist/Caper-macOS-${{ matrix.label }}.zip
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: |
          [[ -z "${CAPER_SIGNING_KEYCHAIN:-}" ]] || security delete-keychain "$CAPER_SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/apple.json"

  testflight:
    name: iOS / TestFlight
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.RELEASE_SIGNER_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load the App Store Connect API key
        run: |
          set -euo pipefail
          secret="$RUNNER_TEMP/apple.json"
          aws secretsmanager get-secret-value --secret-id production/signing/release \
            --query SecretString --output text | jq -e '.apple | objects' >"$secret"
          chmod 0600 "$secret"
          jq -r .app_store_connect_private_key "$secret" >"$RUNNER_TEMP/asc.p8"
          chmod 0600 "$RUNNER_TEMP/asc.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/asc.p8"
            echo "NOTARY_KEY_ID=$(jq -r .app_store_connect_key_id "$secret")"
            echo "NOTARY_ISSUER=$(jq -r .app_store_connect_issuer_id "$secret")"
            echo "APPLE_TEAM_ID=$(jq -r .team_id "$secret")"
          } >>"$GITHUB_ENV"
          rm -f "$secret"
      - name: Use Xcode 26
        # App Store Connect only accepts iOS builds made with the iOS 26 SDK or later.
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          [[ -n "$xcode" ]] || { echo "No Xcode 26 on this runner:" >&2; ls -d /Applications/Xcode* >&2; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Archive and upload to TestFlight
        env:
          # Unique and increasing across runs and re-runs, e.g. 12.1 then 12.2.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: bash apps/native/apple/upload-testflight.sh
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/apple.json"

  android:
    name: Android / release APK
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.RELEASE_SIGNER_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load the upload keystore
        run: |
          set -euo pipefail
          secret="$RUNNER_TEMP/android.json"
          aws secretsmanager get-secret-value --secret-id production/signing/release \
            --query SecretString --output text | jq -e '.android | objects' >"$secret"
          chmod 0600 "$secret"
          for key in keystore_password key_password; do
            echo "::add-mask::$(jq -r ".$key" "$secret")"
          done
          jq -r .keystore_base64 "$secret" | base64 --decode >"$RUNNER_TEMP/caper-release.jks"
          chmod 0600 "$RUNNER_TEMP/caper-release.jks"
          {
            echo "CAPER_ANDROID_KEYSTORE=$RUNNER_TEMP/caper-release.jks"
            echo "CAPER_ANDROID_KEYSTORE_PASSWORD=$(jq -r .keystore_password "$secret")"
            echo "CAPER_ANDROID_KEY_ALIAS=$(jq -r .key_alias "$secret")"
            echo "CAPER_ANDROID_KEY_PASSWORD=$(jq -r .key_password "$secret")"
          } >>"$GITHUB_ENV"
          rm -f "$secret"
      - name: Test and build the signed release APK and Play bundle
        working-directory: apps/native/android
        run: |
          set -euo pipefail
          ./prepare-fonts.sh
          bash prepare-audio.sh
          # The .apk is the direct download; the .aab is what Google Play takes.
          CMAKE_BUILD_PARALLEL_LEVEL=1 ./gradlew --no-daemon --max-workers=1 testDebugUnitTest assembleRelease bundleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Caper-Android.apk
          mkdir -p play
          cp app/build/outputs/bundle/release/app-release.aab play/Caper-Android-Play.aab
          # Signed with the upload key; Google Play re-signs it for devices.
          jarsigner -verify play/Caper-Android-Play.aab | tee play/verify.txt
          grep -q 'jar verified' play/verify.txt
          rm play/verify.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: apps/native/android/dist/Caper-Android.apk
          if-no-files-found: error
          retention-days: 7
      # Not a public download: upload it in Google Play Console (Testing →
      # Internal testing → Create new release) until Play uploads are automated.
      - uses: actions/upload-artifact@v4
        with:
          name: google-play-bundle
          path: apps/native/android/play/Caper-Android-Play.aab
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/caper-release.jks" "$RUNNER_TEMP/android.json"

  desktop:
    name: Desktop / ${{ matrix.target }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          cache-workspaces: apps/native/desktop
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 3 \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /usr/share/keyrings/caper-llvm.asc >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/caper-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/caper-llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-21 lld-21 libglib2.0-dev libpulse0 libasound2t64 libasound2-dev \
            pkg-config libssl-dev libdbus-1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libegl1-mesa-dev
      - name: Windows C++ compiler and SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and package Linux
        if: runner.os == 'Linux'
        env:
          CAPER_UPDATE_PUBLIC_KEY: ${{ needs.resolve.outputs.update_public_key }}
        run: |
          set -euo pipefail
          [[ -n "$CAPER_UPDATE_PUBLIC_KEY" ]] || unset CAPER_UPDATE_PUBLIC_KEY
          bash apps/native/desktop/build.sh
          mkdir -p release
          cp apps/native/desktop/dist/Caper-linux-x64.deb release/Caper-Linux-x64.deb
          cp apps/native/desktop/dist/Caper-linux-x64.tar.gz release/Caper-Linux-x64.tar.gz
      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CAPER_UPDATE_PUBLIC_KEY: ${{ needs.resolve.outputs.update_public_key }}
        run: |
          if (-not $env:CAPER_UPDATE_PUBLIC_KEY) { Remove-Item Env:CAPER_UPDATE_PUBLIC_KEY }
          ./apps/native/desktop/build.ps1
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item apps/native/desktop/dist/Caper-windows-x64.zip release/Caper-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish native-latest
    needs: [resolve, macos, android, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Stage the release files
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          cd release
          assets=(Caper-macOS-Apple-Silicon.zip Caper-macOS-Intel.zip Caper-Android.apk
            Caper-Windows-x64.zip Caper-Linux-x64.deb Caper-Linux-x64.tar.gz)
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" >SHA256SUMS
          cat >notes.md <<EOF
          Test builds of the Caper apps, from \`${RELEASE_SHA::7}\`. They use your caper.chat account.

          **Mac:** download [Apple Silicon](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Caper-macOS-Apple-Silicon.zip) (M1 or newer) or [Intel](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Caper-macOS-Intel.zip), unzip, and drag Caper into Applications. It is signed and notarized by Apple.

          **Android:** open [Caper-Android.apk](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Caper-Android.apk) on the phone and allow installing from your browser when asked. Later versions install over it.

          **Windows:** download [Caper-Windows-x64.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Caper-Windows-x64.zip), unzip, and run Caper.exe. It is not code-signed yet, so Windows may warn first: choose **More info → Run anyway**.

          **Linux:** install [Caper-Linux-x64.deb](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Caper-Linux-x64.deb) on Ubuntu/Debian, or use the [tarball](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Caper-Linux-x64.tar.gz).

          **iPhone:** join through the TestFlight link.
          EOF
          echo "RELEASE_ASSETS=${assets[*]} SHA256SUMS" >>"$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        if: needs.resolve.outputs.update_public_key != ''
        with:
          role-to-assume: ${{ env.RELEASE_SIGNER_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Write and sign the self-update manifest
        if: needs.resolve.outputs.update_public_key != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          UPDATE_PUBLIC_KEY: ${{ needs.resolve.outputs.update_public_key }}
        run: |
          set -euo pipefail
          cd release
          # Shown in the apps' update prompt: the release commit's PR title.
          notes="$(gh api "repos/$GH_REPO/commits/$RELEASE_SHA/pulls" --jq '.[0].title // empty' 2>/dev/null || true)"
          [[ -n "$notes" ]] || notes="$(gh api "repos/$GH_REPO/commits/$RELEASE_SHA" --jq '.commit.message | split("\n")[0]')"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          artifact() {
            jq -n --arg url "$base/$1" --arg sha256 "$(sha256sum "$1" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "$1")" '{url: $url, sha256: $sha256, size: $size}'
          }
          jq -n \
            --argjson build "$CAPER_BUILD_NUMBER" \
            --arg version "0.1.$CAPER_BUILD_NUMBER" \
            --arg commit "$RELEASE_SHA" \
            --arg notes "${notes:0:500}" \
            --argjson macos_arm64 "$(artifact Caper-macOS-Apple-Silicon.zip)" \
            --argjson macos_x64 "$(artifact Caper-macOS-Intel.zip)" \
            --argjson windows_x64 "$(artifact Caper-Windows-x64.zip)" \
            --argjson linux_x64 "$(artifact Caper-Linux-x64.tar.gz)" \
            '{schema: 1, build: $build, version: $version, commit: $commit, notes: $notes,
              platforms: {"macos-arm64": $macos_arm64, "macos-x64": $macos_x64,
                "windows-x64": $windows_x64, "linux-x64": $linux_x64}}' >latest.json
          key="$RUNNER_TEMP/update-key.pem"
          umask 077
          aws secretsmanager get-secret-value --secret-id production/signing/release \
            --query SecretString --output text | jq -r .caper_update.private_key_pem >"$key"
          # Ed25519 over the exact bytes; caper-updater verifies the same way.
          openssl pkeyutl -sign -rawin -inkey "$key" -in latest.json | base64 -w0 >latest.json.sig
          rm -f "$key"
          # The embedded public key must accept what was just signed.
          { printf '%s' "$UPDATE_PUBLIC_KEY" | base64 -d | cat <(printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00') -; } >"$RUNNER_TEMP/update-public.der"
          base64 -d latest.json.sig >"$RUNNER_TEMP/latest.sig.bin"
          openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey "$RUNNER_TEMP/update-public.der" \
            -in latest.json -sigfile "$RUNNER_TEMP/latest.sig.bin"
          cat latest.json
          echo "RELEASE_ASSETS=$RELEASE_ASSETS latest.json latest.json.sig" >>"$GITHUB_ENV"
      - name: Replace the native-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          cd release
          read -r -a files <<<"$RELEASE_ASSETS"
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$RELEASE_TAG" --prerelease --target "$RELEASE_SHA" \
            --title "Caper apps (latest)" --notes-file notes.md "${files[@]}"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/update-key.pem"

  notify-discord:
    name: Update Discord status
    needs: [resolve, macos, testflight, android, desktop, publish]
    if: ${{ always() && inputs.discord_message_id != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Report the release result on the Discord notification
        env:
          DEPLOY_NOTIFICATION_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK_URL }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RELEASE_SHA: ${{ needs.resolve.outputs.sha || inputs.git_sha || github.sha }}
          DISCORD_MESSAGE_ID: ${{ inputs.discord_message_id }}
          DISCORD_STARTED_AT: ${{ inputs.discord_started_at }}
        run: |
          set -euo pipefail
          # Every job must succeed; any failure wins over a cancellation.
          result=success
          for job_result in $RESULTS; do
            case "$job_result" in
              success) ;;
              failure) result=failure ;;
              *) [[ "$result" == failure ]] || result=cancelled ;;
            esac
          done
          bash scripts/update-discord-release.sh \
            --git-sha "$RELEASE_SHA" \
            --message-id "$DISCORD_MESSAGE_ID" \
            --result "$result" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --started-at "$DISCORD_STARTED_AT" \
            --finished-at "$(date +%s)"
