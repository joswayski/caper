name: Recover native release 309

# One-off recovery of the prepared, never-published build after native-latest
# was deleted. Remove this workflow after the owner-approved recovery succeeds.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: 15d71b68178b4147c4c963cf9451a28454c2d669
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to replace an existing release
        run: |
          if gh release view native-latest >/dev/null 2>&1; then
            echo 'native-latest already exists; inspect it instead of replacing it.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42111672924
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42105950487
          name: release-macos-Intel
          path: release
      - name: Recover and verify the exact prepared manifest
        run: |
          gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/127553836910/logs" > "$RUNNER_TEMP/publish.log"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          lines = Path(os.environ['RUNNER_TEMP'], 'publish.log').read_text().splitlines()
          payloads = [line.partition(' ')[2] for line in lines]
          manifests = [line for line in payloads if line.startswith('{"schema":1,')]
          assert len(manifests) == 1, 'Expected exactly one prepared manifest'
          raw = (manifests[0] + '\n').encode()
          manifest = json.loads(raw)
          assert len(raw) <= 65536 and manifest['build'] == 309
          assert manifest['commit'] == os.environ['RELEASE_SHA']
          for platform in manifest['platforms'].values():
              path = Path('release', Path(urlsplit(platform['url']).path).name)
              assert path.stat().st_size == platform['size'], path
              with path.open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == platform['sha256'], path
          Path('release/latest.json').write_bytes(raw)
          print('Verified build 309 manifest against all three updater archives.')
          PY
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::395451633568:role/production-caper-release-signer
          aws-region: us-east-1
      - name: Sign with the existing release key
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/update-key.pem"
          trap 'rm -f "$key"' EXIT
          umask 077
          aws secretsmanager get-secret-value --secret-id production/signing/release \
            --query SecretString --output text | jq -r .caper_update.private_key_pem > "$key"
          openssl pkey -in "$key" -pubout -outform DER > "$RUNNER_TEMP/public.der"
          public="$(tail -c 32 "$RUNNER_TEMP/public.der" | base64 -w0)"
          [[ "$public" == 'rsSdKuBH/6M1gbM2G4LvcZA/mxOWQIp2k5dy6NjSUJs=' ]]
          openssl pkeyutl -sign -rawin -inkey "$key" -in release/latest.json \
            | base64 -w0 > release/latest.json.sig
          base64 -d release/latest.json.sig > "$RUNNER_TEMP/signature.bin"
          openssl pkeyutl -verify -rawin -pubin -keyform DER -inkey "$RUNNER_TEMP/public.der" \
            -in release/latest.json -sigfile "$RUNNER_TEMP/signature.bin"
      - name: Restore downloads without replacing any existing release
        run: |
          set -euo pipefail
          cd release
          files=(Caper-macOS-Apple-Silicon.dmg Caper-macOS-Apple-Silicon.zip
            Caper-Windows-x64-Setup.exe Caper-Windows-x64.zip Caper-Linux-x64.deb Caper-Linux-x64.tar.gz
            Caper-Android.apk Caper-macOS-Intel.dmg Caper-macOS-Intel.zip)
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS
          git push origin "$RELEASE_SHA:refs/tags/native-latest"
          gh release create native-latest --verify-tag --prerelease --target "$RELEASE_SHA" \
            --title 'Caper apps (latest)' \
            --notes 'Restored build 309 downloads and its signed update manifest. Intel Mac downloads retain build 307, the previous successfully signed Intel build. iPhone build 309.1 is available through TestFlight.' \
            "${files[@]}" SHA256SUMS latest.json latest.json.sig
          gh release view native-latest --json targetCommitish,assets \
            --jq '{targetCommitish,assets:[.assets[].name]}'
