name: SFU image
on:
  pull_request:
    paths:
      - apps/sfu/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/sfu-image.yml
  push:
    branches: [main]
    paths:
      - apps/sfu/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/sfu-image.yml
permissions:
  contents: read
jobs:
  sfu:
    # The SFU runs on an x86 Lightsail instance outside the cluster; its
    # benchmark also runs inside the arm64 cluster. Each architecture builds on
    # a native runner, and the image goes to GHCR rather than the private ECR.
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/caper-sfu
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/sfu/Dockerfile
          target: sfu
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: caper-sfu:test
          cache-from: type=gha,scope=sfu-${{ matrix.arch }}
          cache-to: type=gha,scope=sfu-${{ matrix.arch }},mode=max
      - name: Verify health, authentication and the benchmark without real secrets
        run: |
          set -euo pipefail
          container="$(docker run -d -p 8080:8080 \
            -e SFU_PUBLIC_IP=127.0.0.1 -e SFU_APP_ID=app -e SFU_APP_SECRET=secret \
            -e SFU_TURN_KEY_ID=key -e SFU_TURN_API_TOKEN=token caper-sfu:test)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health)" = 204
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/v1/apps/app/sessions/new)" = 401
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer secret' http://127.0.0.1:8080/v1/apps/app/sessions/new)" = 201
          docker run --rm --network host --entrypoint caper-sfu-bench \
            -e MEDIA_PROVIDER_BASE=http://127.0.0.1:8080/v1 -e CF_SFU_APP_ID=app -e CF_SFU_APP_SECRET=secret \
            -e CF_TURN_KEY_ID=key -e CF_TURN_API_TOKEN=token -e BENCH_RUNS=3 caper-sfu:test
      - name: Publish this architecture
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker tag caper-sfu:test "$IMAGE:$GITHUB_SHA-${{ matrix.arch }}"
          docker push "$IMAGE:$GITHUB_SHA-${{ matrix.arch }}"
  manifest:
    needs: sfu
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/caper-sfu
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Publish one multi-architecture tag
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" \
            "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
          digest="$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          printf '### Published SFU image\n\n`%s:%s@%s` (linux/amd64, linux/arm64)\n' "$IMAGE" "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
