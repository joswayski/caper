name: Native release notification

# When the native apps build and pass their tests on main, post a Discord
# notification with a "Deploy Caper apps" button, like the image-ready
# notifications for the web app, API and gateway. Godis dispatches release.yml
# for that exact commit when an authorized user clicks it.
on:
  workflow_run:
    workflows: [Native development builds]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Notify deployment webhook
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Post the Caper apps release notification
        env:
          DEPLOY_NOTIFICATION_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_NOTIFICATION_WEBHOOK_URL" ]]; then
            echo "DEPLOY_NOTIFICATION_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi
          [[ "$GIT_SHA" =~ ^[0-9a-f]{40}$ ]]

          commit_title="${COMMIT_MESSAGE%%$'\n'*}"
          commit_body=""
          if [[ "$COMMIT_MESSAGE" == *$'\n'* ]]; then
            commit_body="${COMMIT_MESSAGE#*$'\n'}"
          fi
          if pull_requests="$(curl --fail --show-error --silent \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GIT_SHA/pulls?per_page=1")" && \
            pull_request="$(jq -cer '.[0] | select(type == "object") | {title, body}' <<< "$pull_requests")"; then
            commit_title="$(jq -r '.title // ""' <<< "$pull_request")"
            commit_body="$(jq -r '.body // ""' <<< "$pull_request")"
          fi

          payload="$(jq -cn \
            --arg git_sha "$GIT_SHA" \
            --arg ci_url "$CI_RUN_URL" \
            --arg release_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml" \
            --arg commit_title "$commit_title" \
            --arg commit_body "$commit_body" \
            'def truncate_field:
              if length > 1024 then .[:1021] + "..." else . end;
            ($commit_title | rtrimstr("\r") | truncate_field) as $title |
            ($commit_body | split("\n") | map(rtrimstr("\r")) | join("\n")
              | sub("^([ \\t]*\\n)+"; "")
              | sub("(\\n[ \\t]*)+$"; "")) as $body |
            {
              username: "Production deploys",
              embeds: [{
                author: {name: "Caper apps build is ready"},
                title: $title,
                color: 11947296,
                fields: ([{name: "Includes", value: "Mac, iPhone (TestFlight), Android, Windows and Linux. Deploy any server changes these apps need first.", inline: false}]
                  + (if $body | test("[^[:space:]]") then
                    [{name: "Description", value: ($body | truncate_field), inline: false}]
                  else [] end) + [
                  {name: "Git SHA", value: ("`" + $git_sha + "`"), inline: false},
                  {name: "Tests", value: ("[Native development builds](" + $ci_url + ")"), inline: false}
                ])
              }],
              components: [{type: 1, components: [
                {type: 2, style: 3, label: "Deploy Caper apps", custom_id: ("production-deploy:v1:caper-apps:" + $git_sha)},
                {type: 2, style: 5, label: "Open GitHub", url: $release_url}
              ]}]
            }')"
          curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 10 \
            --header 'Content-Type: application/json' --data "$payload" \
            "${DEPLOY_NOTIFICATION_WEBHOOK_URL}?wait=false&with_components=true"
