name: API image
# Keep squash commit messages free of CI-skip directives, including quoted PR
# text. A later unrelated push does not backfill a skipped path-filtered build.
on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/api-image.yml
      - tests/api-image-notifications.sh
permissions:
  contents: read
# Runs on main only. Each push gets a unique group (the run id), so publishing
# is never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  route:
    uses: ./.github/workflows/mac-route.yml
    secrets: inherit

  # Builds and tests the image on the Mac's arm64 Linux VM when mac-route.yml
  # picks it, and hands the tested image to the publish job, which runs on
  # GitHub so the ECR role never reaches a self-hosted machine.
  api:
    name: linux/arm64 API image
    needs: route
    runs-on: ${{ needs.route.outputs.linux_arm == 'true' && fromJSON('["self-hosted","joselinux-arm"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners start empty, so they build in a BuildKit container
      # backed by GitHub's layer cache. Self-hosted runners use their own Docker
      # daemon, whose layer cache stays on the machine.
      - if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          platforms: linux/arm64
          load: true
          tags: caper-api:test
          cache-from: ${{ runner.environment == 'github-hosted' && 'type=gha,scope=api' || '' }}
          cache-to: ${{ runner.environment == 'github-hosted' && 'type=gha,scope=api,mode=max' || '' }}
      - name: Verify public health, protected accounts, and retired demo routes
        run: |
          set -euo pipefail
          container="$(docker run -d -p 3001:3001 caper-api:test)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/health; then break; fi
            sleep 1
          done
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/health)" = 204
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/account/me)" = 401
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/media/status)" = 404
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"name":"test"}' http://127.0.0.1:3001/api/media/join)" = 404
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/chat/general)" = 404
      - name: Verify independent gateway entrypoint without secrets
        run: |
          set -euo pipefail
          container="$(docker run -d -p 3002:3002 caper-api:test --gateway)"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/health; then break; fi
            sleep 1
          done
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/health)" = 204
          test "$(curl --silent --show-error -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/readyz)" = 503
      - name: Verify deployment notification payloads
        run: tests/api-image-notifications.sh
      - name: Export the tested image
        run: |
          set -euo pipefail
          docker save caper-api:test | gzip -1 > "$RUNNER_TEMP/caper-api.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: caper-api-image
          path: ${{ runner.temp }}/caper-api.tar.gz
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish immutable API image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: api
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      ECR: 395451633568.dkr.ecr.us-east-1.amazonaws.com/production/caper
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::395451633568:role/production-caper-ecr-publisher
          aws-region: us-east-1
          allowed-account-ids: "395451633568"
      - name: Check immutable tag
        id: existing
        run: |
          digest="$(aws ecr describe-images --repository-name production/caper --image-ids "imageTag=api-$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo 'exists=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          name: caper-api-image
          path: ${{ runner.temp }}
      - name: Load the tested image
        if: steps.existing.outputs.exists != 'true'
        run: docker load --input "$RUNNER_TEMP/caper-api.tar.gz"
      - uses: aws-actions/amazon-ecr-login@v2.1.6
        if: steps.existing.outputs.exists != 'true'
      - name: Publish separately from the website
        if: steps.existing.outputs.exists != 'true'
        run: |
          docker tag caper-api:test "$ECR:api-$GITHUB_SHA"
          docker push "$ECR:api-$GITHUB_SHA"
      - name: Record immutable image
        id: record
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images --repository-name production/caper --image-ids "imageTag=api-$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '### Published API image\n\n`%s:api-%s@%s`\n' "$ECR" "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Notify deployment webhook
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DEPLOY_NOTIFICATION_WEBHOOK_URL: ${{ secrets.DEPLOY_NOTIFICATION_WEBHOOK_URL }}
          DEPLOY_WORKFLOW_URL: https://github.com/joswayski/infrastructure/actions/workflows/deploy-caper-api.yml
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.record.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_NOTIFICATION_WEBHOOK_URL" ]]; then
            echo "DEPLOY_NOTIFICATION_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          commit_title="${COMMIT_MESSAGE%%$'\n'*}"
          commit_body=""
          if [[ "$COMMIT_MESSAGE" == *$'\n'* ]]; then
            commit_body="${COMMIT_MESSAGE#*$'\n'}"
          fi

          if pull_requests="$(curl --fail --show-error --silent \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=1")" && \
            pull_request="$(jq -cer '.[0] | select(type == "object") | {title, body}' <<< "$pull_requests")"; then
            commit_title="$(jq -r '.title // ""' <<< "$pull_request")"
            commit_body="$(jq -r '.body // ""' <<< "$pull_request")"
          fi

          notify_deployment() {
            local application="$1"
            local display_name="$2"
            local deploy_url="$3"
            local payload
            payload="$(jq -cn \
              --arg application "$application" \
              --arg display_name "$display_name" \
              --arg git_sha "$GITHUB_SHA" \
              --arg digest "$IMAGE_DIGEST" \
              --arg deploy_url "$deploy_url" \
              --arg commit_title "$commit_title" \
              --arg commit_body "$commit_body" \
              'def truncate_field:
                if length > 1024 then .[:1021] + "..." else . end;
              ($commit_title | rtrimstr("\r") | truncate_field) as $title |
              ($commit_body | split("\n") | map(rtrimstr("\r")) | join("\n")
                | sub("^([ \\t]*\\n)+"; "")
                | sub("(\\n[ \\t]*)+$"; "")) as $body |
              {
                username: "Production deploys",
                embeds: [{
                  author: {name: ($display_name + " image is ready")},
                  title: $title,
                  color: 11947296,
                  fields: ((if $application == "caper-gateway" then
                    [{name: "Deploy API first", value: "Deploy the matching Caper API image successfully first. Gateway deployment verifies the live API rollout before changing its image.", inline: false}]
                  else [] end) + (if $body | test("[^[:space:]]") then
                    [{name: "Description", value: ($body | truncate_field), inline: false}]
                  else [] end) + [
                    {name: "Git SHA", value: ("`" + $git_sha + "`"), inline: false},
                    {name: "Digest", value: ("`" + $digest + "`"), inline: false}
                  ])
                }],
                components: [{type: 1, components: [
                  {type: 2, style: 3, label: ("Deploy " + $display_name), custom_id: ("production-deploy:v1:" + $application + ":" + $git_sha)},
                  {type: 2, style: 5, label: "Open GitHub", url: $deploy_url}
                ]}]
              }')"
            curl --fail --show-error --silent --retry 3 --retry-all-errors --max-time 10 \
              --header 'Content-Type: application/json' --data "$payload" \
              "${DEPLOY_NOTIFICATION_WEBHOOK_URL}?wait=false&with_components=true"
          }

          notify_deployment "caper-api" "Caper API" "$DEPLOY_WORKFLOW_URL"
          notify_deployment "caper-gateway" "Caper chat gateway" \
            "https://github.com/joswayski/infrastructure/actions/workflows/deploy-caper-gateway.yml"
