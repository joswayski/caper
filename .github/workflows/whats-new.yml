name: Publish What’s new
run-name: What’s new ${{ inputs.audience }} ${{ inputs.git_sha }}

# Native drafts the words while its apps build (draft: true), then publishes
# them just before the self-update manifest, reusing the draft when its evidence
# is unchanged, so an update never goes live before its notes. Infrastructure
# dispatches it with the exact confirmed web image SHA after its rollout wait
# succeeds.
on:
  workflow_dispatch:
    inputs:
      audience:
        description: Successfully shipped clients
        required: true
        type: choice
        options: [web, native]
      git_sha:
        description: Exact successfully shipped source revision
        required: true
        type: string
      native_version:
        description: Actual native app version (leave empty for web or legacy reruns)
        required: false
        type: string
  workflow_call:
    inputs:
      audience:
        required: true
        type: string
      git_sha:
        required: true
        type: string
      native_version:
        required: false
        type: string
      draft:
        description: Write and keep the answer without publishing anything
        required: false
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'joswayski/caper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Drafts publish nothing, so they never wait behind or block a publish.
    concurrency:
      group: caper-whats-new-${{ inputs.audience }}${{ inputs.draft && '-draft' || '' }}
      cancel-in-progress: false
    steps:
      # Tooling comes from main, including when an older app revision ships.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the shipped revision
        env:
          RELEASE_SHA: ${{ inputs.git_sha }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AUDIENCE" == web || "$AUDIENCE" == native ]]
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
      - name: Read the drafted answer
        if: ${{ !inputs.draft }}
        # Missing for repairs and when drafting failed; publishing then asks Claude.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: whats-new-answer-${{ inputs.audience }}
          path: ${{ runner.temp }}/whats-new-answer
      - name: Generate and publish user-facing highlights
        id: notes
        # An unavailable editorial service must not fail a shipped app or replace
        # its last good notes with technical commit titles.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Required when the key is not scoped to a single workspace.
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # Empty variables fall back to the generator defaults (Opus 5.5, high effort).
          ANTHROPIC_MODEL: ${{ vars.CAPER_RELEASE_NOTES_MODEL }}
          ANTHROPIC_EFFORT: ${{ vars.CAPER_RELEASE_NOTES_EFFORT }}
          RELEASE_SHA: ${{ inputs.git_sha }}
          AUDIENCE: ${{ inputs.audience }}
          NATIVE_VERSION: ${{ inputs.native_version }}
          DRAFT: ${{ inputs.draft && 'true' || 'false' }}
        run: |
          args=()
          if [[ -n "$NATIVE_VERSION" ]]; then args+=(--native-version "$NATIVE_VERSION"); fi
          answer="$RUNNER_TEMP/whats-new-answer/answer.json"
          if [[ "$DRAFT" == true ]]; then
            args+=(--save-answer "$answer")
          else
            args+=(--publish)
            if [[ -f "$answer" ]]; then args+=(--answer "$answer"); fi
          fi
          python scripts/whats_new.py --revision "$RELEASE_SHA" --audience "$AUDIENCE" \
            --output-dir "$RUNNER_TEMP/whats-new" "${args[@]}"
      - name: Keep the drafted answer
        if: ${{ inputs.draft && steps.notes.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: whats-new-answer-${{ inputs.audience }}
          path: ${{ runner.temp }}/whats-new-answer/answer.json
          # Absent when the release has no client changes to describe.
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7
      - name: Record the notes outcome
        if: always()
        env:
          OUTCOME: ${{ steps.notes.outcome }}
          DRAFT: ${{ inputs.draft && 'true' || 'false' }}
        run: |
          if [[ "$DRAFT" == true ]]; then
            if [[ "$OUTCOME" == success ]]; then
              echo 'Release highlights drafted; publishing reuses them if the evidence is unchanged.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo '::warning::Release highlights could not be drafted. Publishing will ask Claude again.'
              echo 'Release highlights draft failed. Publishing will ask Claude again; check the generator step.' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$OUTCOME" == success ]]; then
            echo 'Release highlights published or reused. First publication establishes a quiet baseline.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::Release highlights were not published. Existing notes remain unchanged; the app release is unaffected.'
            echo 'Release highlights unavailable. Check the generator step and credentials, then rerun this workflow for the same shipped SHA.' >> "$GITHUB_STEP_SUMMARY"
          fi
