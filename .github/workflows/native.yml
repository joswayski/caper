name: Native development builds

# Runs on main only; pull requests get no CI. Use "Run workflow" to test a branch.
on:
  push:
    branches: [main]
    paths:
      - apps/native/**
      - apps/api/src/**
      - apps/web/public/caper-face.svg
      - scripts/generate-favicons.mjs
      - tests/desktop-icons.test.mjs
      - shared/design.css
      - shared/emoji/**
      - scripts/native-emoji.mjs
      - shared/fonts/**
      - scripts/native_fonts.py
      - scripts/native-parity-fixture.mjs
      - tests/native-parity-fixture.test.mjs
      - scripts/native_artifacts.py
      - tests/test_native_artifacts.py
      - tests/test_apple_release_signing.py
      - scripts/native_changelog.py
      - tests/test_native_changelog.py
      - .github/workflows/native.yml
      - package.json
      - package-lock.json
      - vitest.config.ts
  workflow_dispatch:

# No signing credentials, release, store upload, or deploy.
permissions:
  contents: read
  actions: write

# The running build always finishes and only the newest waiting push runs next
# (GitHub replaces older pending runs in the group), so fast pushes neither
# starve main of finished builds nor pile up.
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    uses: ./.github/workflows/mac-route.yml
    secrets: inherit

  artifact-contract:
    needs: route
    runs-on: ${{ needs.route.outputs.linux == 'true' && fromJSON('["self-hosted","joselinux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python -m unittest discover -s tests -p test_native_artifacts.py -v
      - run: python -m unittest discover -s tests -p test_apple_release_signing.py -v
      - run: python -m unittest discover -s tests -p test_native_changelog.py -v
      - run: python shared/fonts/test_native_fonts.py -v
      - run: npm run test:native
      - name: Verify bundled Apple emoji match the shared artwork and licenses
        run: diff -qr shared/emoji apps/native/apple/Sources/CaperCore/EmojiAssets
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  updater:
    name: Updater / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    needs: route
    runs-on: ${{ needs.route.outputs.mac == 'true' && matrix.os == 'macos-15' && fromJSON('["self-hosted","josemac"]') || needs.route.outputs.windows == 'true' && startsWith(matrix.os, 'windows') && fromJSON('["self-hosted","josewin"]') || needs.route.outputs.linux == 'true' && startsWith(matrix.os, 'ubuntu') && fromJSON('["self-hosted","joselinux"]') || matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: apps/native/updater
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          cache-workspaces: apps/native/updater
          # Pull requests restore main's cache but do not upload their own.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  desktop:
    name: Desktop / ${{ matrix.target }}
    needs: [artifact-contract, route]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ needs.route.outputs.windows == 'true' && startsWith(matrix.os, 'windows') && fromJSON('["self-hosted","josewin"]') || needs.route.outputs.linux == 'true' && startsWith(matrix.os, 'ubuntu') && fromJSON('["self-hosted","joselinux"]') || matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
          cache-workspaces: apps/native/desktop
          # Keep in sync with release.yml so releases reuse this cache.
          # Bumped on Windows when its target-triple directory became cacheable.
          cache-key: ${{ matrix.target == 'windows-x64' && 'windows-target-triple' || '' }}
          # Pull requests restore main's cache but do not upload their own.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 3 \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /usr/share/keyrings/caper-llvm.asc >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/caper-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/caper-llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-21 lld-21 libglib2.0-dev libpulse0 libasound2t64 libasound2-dev \
            pkg-config libssl-dev libdbus-1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libegl1-mesa-dev
      - name: Windows C++ compiler and SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and package Linux
        if: runner.os == 'Linux'
        run: bash apps/native/desktop/build.sh
      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The self-hosted Windows PC installs NSIS at setup; its non-admin runners cannot use choco.
          if ($env:RUNNER_ENVIRONMENT -ne 'self-hosted') {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./apps/native/desktop/build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./apps/native/desktop/test-installer.ps1 -Setup "$PWD/apps/native/desktop/dist/Caper-windows-x64-Setup.exe" -Stage "$PWD/apps/native/desktop/target/package/Caper-windows-x64"
      - name: Let the Rust cache keep Windows target-triple dependencies
        # build.ps1 passes --target, so dependencies land in
        # target/x86_64-pc-windows-msvc. rust-cache only treats a directory as
        # a nested target dir when it has a CACHEDIR.TAG; otherwise it deletes
        # its debug/ and release/ folders before saving.
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          triple_dir=apps/native/desktop/target/x86_64-pc-windows-msvc
          if [[ -d "$triple_dir" && ! -e "$triple_dir/CACHEDIR.TAG" ]]; then
            printf 'Signature: 8a477f597d28d172789f06886806bc55\n' >"$triple_dir/CACHEDIR.TAG"
          fi
      - name: Record exact checked-out revision and checksums
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/native_artifacts.py --target "$TARGET" \
            --revision "$(git rev-parse HEAD)" --source apps/native/desktop/dist \
            --destination "dist/native/$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: caper-development-${{ matrix.target }}-${{ github.sha }}
          path: dist/native/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  apple:
    name: Apple / ${{ matrix.target }}
    needs: [artifact-contract, route]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            target: macos-arm64
          - os: macos-15-intel
            platform: macos
            target: macos-x64
          - os: macos-15
            platform: ios
            target: ios-simulator-arm64
    # Intel builds stay on GitHub-hosted macos-15-intel. On the self-hosted Mac
    # the macOS UI tests (josemac-ui) and the iOS simulator (josemac-sim) run in
    # different VMs so the two jobs run at the same time.
    runs-on: ${{ needs.route.outputs.mac == 'true' && matrix.os == 'macos-15' && (matrix.platform == 'ios' && fromJSON('["self-hosted","josemac-sim"]') || fromJSON('["self-hosted","josemac-ui"]')) || matrix.os }}
    # A cold Intel build plus UI tests can exceed 30 minutes while still
    # progressing normally. Keep the existing budget for ARM and iOS.
    timeout-minutes: ${{ matrix.target == 'macos-x64' && 45 || 30 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Runs alongside the build: it packages a fixture app in a temporary
      # directory and shares nothing with build.sh.
      - name: Smoke-test the Mac drag-to-Applications disk image
        if: matrix.platform == 'macos'
        background: true
        run: |
          python3 -m pip install dmgbuild==1.6.7
          python3 -m unittest discover -s tests -p test_apple_release_signing.py -v
      - name: Build and package Apple development client
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash apps/native/apple/build.sh "$PLATFORM"
      # wait-all rather than naming the smoke test: that step is skipped for iOS.
      - name: Wait for the disk image smoke test
        wait-all:
      - name: Record exact checked-out revision and checksums
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/native_artifacts.py --target "$TARGET" \
            --revision "$(git rev-parse HEAD)" --source apps/native/apple/dist \
            --destination "dist/native/$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: caper-development-${{ matrix.target }}-${{ github.sha }}
          path: dist/native/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

      - name: Provide room for the macOS desktop reference window
        if: matrix.target == 'macos-x64'
        run: |
          # The hosted VM can default to 1024x768, forcing the medium layout.
          # Leave room for a 1440x900 app window and native menu/Dock chrome.
          # ARM Anka guests reject dynamic resizing; their UI tests explicitly
          # label the constrained capture as medium instead of desktop.
          if [[ -x '/Library/Application Support/Veertu/Anka/addons/change_res' ]]; then
            '/Library/Application Support/Veertu/Anka/addons/change_res' 1920x1080x32@30
          elif [[ -x '/Library/Application Support/VMware Tools/vmware-resolutionSet' ]]; then
            '/Library/Application Support/VMware Tools/vmware-resolutionSet' 1920 1080
          else
            echo '::warning::No supported VM display resizer; UI tests record the actual window size.'
          fi
          sleep 3
          system_profiler SPDisplaysDataType
      - name: Clear macOS notices off the self-hosted VM's screen
        # Starting the runner's launchd service posts an "App Background Activity"
        # notice that sits over the top-right of the screen, where UI tests click
        # dialog close buttons, and clicking it opens System Settings.
        if: runner.environment == 'self-hosted' && matrix.platform == 'macos'
        run: |
          osascript -e 'quit app "System Settings"' 2>/dev/null || true
          killall NotificationCenter 2>/dev/null || true
          sleep 2
      - name: Exercise native UI against the loopback parity fixture
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash apps/native/apple/parity-screenshots.sh "$PLATFORM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caper-ui-${{ matrix.target }}-${{ github.sha }}
          path: |
            apps/native/apple/parity-artifacts/
            apps/native/apple/ParityResults.xcresult/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"

  android:
    name: Android / development APK
    needs: [artifact-contract, route]
    runs-on: ${{ needs.route.outputs.linux == 'true' && fromJSON('["self-hosted","joselinux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Caches the Gradle user home (wrapper, dependencies). Writes only from
      # main; manual runs on other branches restore read-only.
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - name: Test, lint, build and package Android
        run: bash apps/native/android/build.sh
      - name: Record exact checked-out revision and checksums
        run: |
          python scripts/native_artifacts.py --target android-debug \
            --revision "$(git rev-parse HEAD)" --source apps/native/android/dist \
            --destination dist/native/android-debug
      - uses: actions/upload-artifact@v4
        with:
          name: caper-development-android-debug-${{ github.sha }}
          path: dist/native/android-debug/
          if-no-files-found: error
          retention-days: 14
      - name: Build a separate loopback-only fixture APK
        run: bash apps/native/android/fixture-build.sh
      - name: Start the local parity fixture (no external API or SFU)
        run: |
          node scripts/native-parity-fixture.mjs > "$RUNNER_TEMP/caper-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/caper-fixture.pid"
          for attempt in {1..50}; do
            if curl --silent --fail http://127.0.0.1:3001/health >/dev/null; then break; fi
            sleep .1
          done
          curl --silent --fail http://127.0.0.1:3001/health
      - name: Enable emulator KVM on the GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Android guest, login, chat, management and narrow UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            CMAKE_BUILD_PARALLEL_LEVEL=1 apps/native/android/gradlew -p apps/native/android --no-daemon --max-workers=1 -PcaperFixtureMode=true -PcaperApiBaseUrl=http://localhost:3001 connectedDebugAndroidTest
            mkdir -p apps/native/android/dist/ui
            find apps/native/android/app/build/outputs/connected_android_test_additional_output -type f \( -name 'voice-roster-connected-*.png' -o -name 'profile-*-test-fixture.png' -o -name 'reaction-*-test-fixture.png' \) -exec cp {} apps/native/android/dist/ui/ \;
            test -s apps/native/android/dist/ui/voice-roster-connected-closed.png && test -s apps/native/android/dist/ui/voice-roster-connected-open.png
            python apps/native/android/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caper-ui-android-${{ github.sha }}
          path: |
            apps/native/android/dist/ui/
            apps/native/android/app/build/reports/tests/
            apps/native/android/app/build/test-results/
            apps/native/android/app/build/reports/androidTests/
            apps/native/android/app/build/outputs/androidTest-results/
            apps/native/android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the parity fixture
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/caper-fixture.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/caper-fixture.pid")" 2>/dev/null || true
          fi
      - name: Stop the rest of this run after a failure
        # One failed job already fails the run; cancel the other jobs instead of
        # letting them hold runners (and block newer pushes) until they finish.
        if: failure()
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null \
            || echo "::warning::Could not cancel the rest of this run"
