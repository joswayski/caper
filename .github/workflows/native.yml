name: Native development builds

# Nightly and manual only, so pushes to main never wait on these 30-60 minute
# native UI suites. Releases build and test each client themselves (release.yml);
# this run is the deeper overnight check. Use "Run workflow" to check a change sooner.
# Apple jobs are manual on main only: the existing local Mac admission hook
# accepts pushes/manual runs, not scheduled jobs. There is no cloud Mac fallback.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

# No signing credentials, release, store upload, or deploy.
permissions:
  contents: read

# The running build always finishes and only the newest waiting run starts next
# (GitHub replaces older pending runs in the group), so runs never pile up.
# Jobs do not cancel each other on failure: each platform reports its own
# result, so one failing suite never shows up as other platforms "cancelled".
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    uses: ./.github/workflows/mac-route.yml
    secrets: inherit

  desktop:
    name: Desktop / ${{ matrix.target }}
    needs: route
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ needs.route.outputs.windows == 'true' && startsWith(matrix.os, 'windows') && fromJSON('["self-hosted","josewin"]') || needs.route.outputs.linux == 'true' && startsWith(matrix.os, 'ubuntu') && fromJSON('["self-hosted","joselinux"]') || matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          cache-workspaces: apps/native/desktop
          # Keep in sync with release.yml so releases reuse this cache.
          # Bumped on Windows when its target-triple directory became cacheable.
          cache-key: ${{ matrix.target == 'windows-x64' && 'windows-target-triple' || '' }}
          # Pull requests restore main's cache but do not upload their own.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 3 \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /usr/share/keyrings/caper-llvm.asc >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/caper-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/caper-llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-21 lld-21 libglib2.0-dev libpulse0 libasound2t64 libasound2-dev \
            pkg-config libssl-dev libdbus-1-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libegl1-mesa-dev nasm \
            libgtk-3-dev libgtk-4-dev libwebkit2gtk-4.1-dev
      - name: Windows C++ compiler and SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Build and package Linux
        if: runner.os == 'Linux'
        run: bash apps/native/desktop/build.sh
      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The self-hosted Windows PC installs NSIS at setup; its non-admin runners cannot use choco.
          if ($env:RUNNER_ENVIRONMENT -ne 'self-hosted') {
            # The Chocolatey feed can return 504 while resolving nsis.install.
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              choco install nsis --version=3.11 -y --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { exit $LASTEXITCODE }
              Write-Warning "NSIS installation failed (attempt $attempt/3); retrying."
              Start-Sleep -Seconds (15 * $attempt)
            }
          }
          ./apps/native/desktop/build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./apps/native/desktop/test-installer.ps1 -Setup "$PWD/apps/native/desktop/dist/Caper-windows-x64-Setup.exe" -Stage "$PWD/apps/native/desktop/target/package/Caper-windows-x64"
      - name: Let the Rust cache keep Windows target-triple dependencies
        # build.ps1 passes --target, so dependencies land in
        # target/x86_64-pc-windows-msvc. rust-cache only treats a directory as
        # a nested target dir when it has a CACHEDIR.TAG; otherwise it deletes
        # its debug/ and release/ folders before saving.
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          triple_dir=apps/native/desktop/target/x86_64-pc-windows-msvc
          if [[ -d "$triple_dir" && ! -e "$triple_dir/CACHEDIR.TAG" ]]; then
            printf 'Signature: 8a477f597d28d172789f06886806bc55\n' >"$triple_dir/CACHEDIR.TAG"
          fi
      - name: Record exact checked-out revision and checksums
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/native_artifacts.py --target "$TARGET" \
            --revision "$(git rev-parse HEAD)" --source apps/native/desktop/dist \
            --destination "dist/native/$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: caper-development-${{ matrix.target }}-${{ github.sha }}
          path: dist/native/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  # The GTK 4 Linux client (apps/native/linux) is in development: check and
  # test it here, and upload a tester tarball as a workflow artifact. Nothing
  # releases or ships it.
  linux-gtk:
    name: Linux GTK / development check
    needs: route
    runs-on: ${{ needs.route.outputs.linux == 'true' && fromJSON('["self-hosted","joselinux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          cache-workspaces: apps/native/desktop
          # Separate from the desktop job's cache, which also holds release builds.
          cache-key: linux-gtk
          # Pull requests restore main's cache but do not upload their own.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux native build dependencies
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 3 \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /usr/share/keyrings/caper-llvm.asc >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/caper-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/caper-llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-21 lld-21 libglib2.0-dev libpulse0 libasound2t64 libasound2-dev \
            pkg-config libssl-dev libdbus-1-dev libgtk-4-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb xdotool dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0 gnome-keyring desktop-file-utils
      - name: Format, lint and test caper-linux
        env:
          CARGO_BUILD_JOBS: '2'
          CC: clang-21
          CXX: clang++-21
        run: |
          # The client embeds Satoshi, and caper-client links the pinned libwebrtc.
          python3 scripts/native_fonts.py
          export LK_CUSTOM_WEBRTC="$(python3 apps/native/desktop/voice-spike/fetch_libwebrtc.py --platform linux)"
          manifest=apps/native/desktop/Cargo.toml
          cargo fmt --manifest-path "$manifest" --package caper-linux -- --check
          cargo clippy --manifest-path "$manifest" --locked --package caper-linux --all-targets --no-deps -- -D warnings
          cargo test --manifest-path "$manifest" --locked --package caper-linux
      # The tester build (apps/native/linux/package.sh), installed the way a
      # tester installs it, then read through AT-SPI against the parity
      # fixture: sign-in, named message rows and toolbars, and a send. Ubuntu
      # 24.04 has GTK 4.14, newer than the 4.8 the client targets.
      - name: Package and smoke caper-linux under Xvfb
        env:
          CARGO_BUILD_JOBS: '2'
          CC: clang-21
          CXX: clang++-21
        run: |
          python3 tests/test_linux_install.py -v
          export LK_CUSTOM_WEBRTC="$(python3 apps/native/desktop/voice-spike/fetch_libwebrtc.py --platform linux)"
          cargo build --manifest-path apps/native/desktop/Cargo.toml --locked --release --package caper-linux
          cargo build --manifest-path apps/native/desktop/Cargo.toml --locked --release --package caper-web-player --features engine
          apps/native/linux/package.sh apps/native/desktop/target/release/caper-linux "$RUNNER_TEMP/tester" \
            apps/native/desktop/target/release/caper-web-player
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/tester/caper-linux-x64.tar.gz" -C "$RUNNER_TEMP/unpacked"
          PREFIX="$RUNNER_TEMP/installed" "$RUNNER_TEMP/unpacked/caper-linux-x64/install.sh"
          CAPER_FIXTURE_PORT=3911 CAPER_FIXTURE_GATEWAY_PORT=3912 \
            node scripts/native-parity-fixture.mjs >"$RUNNER_TEMP/fixture.log" 2>&1 &
          timeout 30 bash -c 'until curl -s -o /dev/null http://127.0.0.1:3911/; do sleep 0.5; done'
          # The system Python, which has PyGObject.
          timeout 300 xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session -- \
            /usr/bin/python3 -I apps/native/linux/smoke.py \
            --binary "$RUNNER_TEMP/installed/bin/caper-linux" --api-url http://127.0.0.1:3911
      # For testers and apps/native/linux/hardware-check.sh (FROM_CI=1); not a release.
      - uses: actions/upload-artifact@v4
        with:
          name: caper-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/tester/caper-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The native Windows client (apps/native/windows): compiled and checked here
  # only. It is not packaged, uploaded or released, and release.yml never
  # builds it.
  windows-native:
    name: Windows native client (development)
    needs: route
    runs-on: ${{ needs.route.outputs.windows == 'true' && fromJSON('["self-hosted","josewin"]') || 'windows-2025' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          cache-workspaces: apps/native/desktop
          # Its own cache, so it never replaces the one releases reuse.
          cache-key: windows-native-client
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Windows C++ compiler and SDK environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Check and build caper-windows
        shell: pwsh
        working-directory: apps/native/desktop
        run: |
          # The compile-time inputs build.ps1 also prepares: Satoshi, which
          # the client embeds, and libwebrtc, which caper-client links.
          python ../../../scripts/native_fonts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:LK_CUSTOM_WEBRTC = python voice-spike/fetch_libwebrtc.py --platform windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          $env:CARGO_BUILD_JOBS = "2"
          $target = "x86_64-pc-windows-msvc"
          cargo fmt --package caper-windows -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --package caper-windows --target $target --locked --all-targets --no-deps -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --package caper-windows --target $target --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --package caper-windows --target $target --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  apple:
    name: Apple / ${{ matrix.target }}
    needs: route
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            target: macos-arm64
          - platform: macos
            target: macos-x64
          - platform: ios
            target: ios-simulator-arm64
    # On the self-hosted Mac the macOS UI tests (josemac-ui) and the iOS
    # simulator (josemac-sim) run in different VMs so they run at the same time.
    # Apple allows only two macOS VMs per Mac, so the Intel job builds x86_64 in
    # the UI VM and runs its tests under Rosetta, not on physical Intel/macOS 15.
    # If the local VM is unavailable, wait rather than acquire a cloud Mac.
    runs-on: ${{ matrix.platform == 'ios' && fromJSON('["self-hosted","josemac-sim"]') || fromJSON('["self-hosted","josemac-ui"]') }}
    # Cold package and parity builds can take 27 minutes on iOS and 33 minutes
    # on hosted Intel before the UI suite starts, and the hosted iOS suite ran
    # past 60 minutes; hosted macOS ARM ran past 30 under capacity constraints.
    # Give each room to finish; each XCTest keeps its execution timeout.
    timeout-minutes: ${{ matrix.platform == 'ios' && 90 || 60 }}
    env:
      # build.sh and parity-screenshots.sh target the runner's own architecture otherwise.
      CAPER_MACOS_ARCH: ${{ matrix.target == 'macos-x64' && 'x86_64' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: matrix.platform == 'macos'
        with:
          version-file: pyproject.toml
      # Runs alongside the build: it packages a fixture app in a temporary
      # directory and shares nothing with build.sh.
      - name: Smoke-test the Mac drag-to-Applications disk image
        if: matrix.platform == 'macos'
        background: true
        run: |
          uv run --locked --only-group dmg python -m unittest discover -s tests -p test_apple_release_signing.py -v
      - name: Install Rosetta for the Intel build on Apple silicon
        if: matrix.target == 'macos-x64' && runner.arch == 'ARM64'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo -n softwareupdate --install-rosetta --agree-to-license
      - name: Create the iPhone 16 simulator the iOS suites target
        # The Xcode 27 image ships the iPhone 16 device type but no device, and
        # iOS 27 runtimes refuse it ("Incompatible device"); like the
        # self-hosted Mac, use the newest runtime that still runs iPhone 16.
        if: matrix.platform == 'ios' && runner.environment != 'self-hosted'
        run: |
          set -euo pipefail
          if ! xcrun simctl list devices available | grep -q '^ *iPhone 16 ('; then
            for runtime in $(xcrun simctl list runtimes available | sed -n 's/^iOS .* - \(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]*\)$/\1/p' | sort -t- -k2,2nr -k3,3nr); do
              xcrun simctl create 'iPhone 16' com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime" >/dev/null 2>&1 && break
            done
          fi
          xcrun simctl list devices available | grep '^ *iPhone 16 ('
      # prepare.sh builds CaperMobile.xcframework, the shared Rust library.
      - uses: ./.github/actions/mobile-rust
        with:
          platform: apple
      - name: Build and package Apple development client
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash apps/native/apple/build.sh "$PLATFORM"
      # wait-all rather than naming the smoke test: that step is skipped for iOS.
      - name: Wait for the disk image smoke test
        wait-all:
      - name: Record exact checked-out revision and checksums
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/native_artifacts.py --target "$TARGET" \
            --revision "$(git rev-parse HEAD)" --source apps/native/apple/dist \
            --destination "dist/native/$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: caper-development-${{ matrix.target }}-${{ github.sha }}
          path: dist/native/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

      - name: Provide room for the macOS desktop reference window
        if: matrix.target == 'macos-x64' && runner.environment != 'self-hosted'
        run: |
          # The hosted VM can default to 1024x768, forcing the medium layout.
          # Leave room for a 1440x900 app window and native menu/Dock chrome.
          # ARM Anka guests reject dynamic resizing; their UI tests explicitly
          # label the constrained capture as medium instead of desktop.
          if [[ -x '/Library/Application Support/Veertu/Anka/addons/change_res' ]]; then
            '/Library/Application Support/Veertu/Anka/addons/change_res' 1920x1080x32@30
          elif [[ -x '/Library/Application Support/VMware Tools/vmware-resolutionSet' ]]; then
            '/Library/Application Support/VMware Tools/vmware-resolutionSet' 1920 1080
          else
            echo '::warning::No supported VM display resizer; UI tests record the actual window size.'
          fi
          sleep 3
          system_profiler SPDisplaysDataType
      - name: Clear macOS notices off the screen
        # Starting the runner's launchd service posts an "App Background Activity"
        # notice that sits over the top-right of the screen, where UI tests click
        # dialog close buttons, and clicking it opens System Settings. Privacy
        # alerts such as "Allow Python to find devices on local networks?" (from
        # the build's Python steps) sit over the app window until answered and
        # keep keyboard focus from it; hosted runners can show that one too.
        if: matrix.platform == 'macos'
        run: |
          osascript -e 'quit app "System Settings"' 2>/dev/null || true
          killall NotificationCenter UserNotificationCenter 2>/dev/null || true
          # The VM keeps the app's saved window frames between runs; the parity
          # tests expect the default desktop window size.
          defaults read chat.caper.macos 2>/dev/null | sed -n 's/^ *"\(NSWindow Frame [^"]*\)".*/\1/p' |
            while IFS= read -r key; do defaults delete chat.caper.macos "$key"; done
          sleep 2
          # A UI test fails on any window over the app; name what is still there.
          pgrep -lx 'System Settings|UserNotificationCenter' || true
      - name: Reset the self-hosted simulator's privacy answers
        # The VM keeps its simulator between runs: a photo prompt answered in an
        # earlier run hid the attach drawer's library. The tests expect to be asked.
        if: runner.environment == 'self-hosted' && matrix.platform == 'ios'
        run: |
          udid="$(xcrun simctl list devices available | sed -n 's/^ *iPhone 16 (\([0-9A-F-]*\)).*/\1/p' | tail -1)"
          if [[ -z "$udid" ]]; then
            echo '::warning::No iPhone 16 simulator to reset.'
            exit 0
          fi
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl privacy "$udid" reset all chat.caper.ios || echo '::warning::Could not reset simulator privacy.'
      - name: Exercise native UI against the loopback parity fixture
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash apps/native/apple/parity-screenshots.sh "$PLATFORM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caper-ui-${{ matrix.target }}-${{ github.sha }}
          path: |
            apps/native/apple/parity-artifacts/
            apps/native/apple/ParityResults.xcresult/
          if-no-files-found: warn
          retention-days: 14

  appkit:
    name: Apple / AppKit development host
    needs: route
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # A sibling job, not a dependency of the shipping Apple clients.
    runs-on: [self-hosted, josemac-ui]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/mobile-rust
        with:
          platform: apple
      - name: Prepare the isolated native project
        run: |
          bash apps/native/apple/prepare.sh
          apps/native/apple/.build/xcodegen-21ac9944b0ab546a07422dbed86f33dd2ebd76f8/.build/debug/xcodegen generate \
            --spec apps/native/apple/native-project.yml --project apps/native/apple
      - name: Test AppKit timeline and shared Apple contracts
        run: |
          set -o pipefail
          xcodebuild -project apps/native/apple/CaperNative.xcodeproj -scheme CaperAppKit \
            -configuration Debug -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath apps/native/apple/.build/NativeDerivedData \
            -resultBundlePath "$RUNNER_TEMP/AppKitTests.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 test | tee "$RUNNER_TEMP/appkit-tests.log"
      - name: Compile the development-only AppKit host
        run: |
          set -o pipefail
          xcodebuild -project apps/native/apple/CaperNative.xcodeproj -scheme CaperAppKit \
            -configuration Release -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath apps/native/apple/.build/NativeDerivedData \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES build | tee "$RUNNER_TEMP/appkit-build.log"
          app=apps/native/apple/.build/NativeDerivedData/Build/Products/Release/CaperAppKit.app
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = chat.caper.appkit-development
          test -x "$app/Contents/MacOS/CaperAppKit"
          codesign --verify --deep --strict "$app"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caper-appkit-checks-${{ github.sha }}
          path: |
            ${{ runner.temp }}/AppKitTests.xcresult/
            ${{ runner.temp }}/appkit-tests.log
            ${{ runner.temp }}/appkit-build.log
          if-no-files-found: warn
          retention-days: 14

  uikit:
    name: Apple / UIKit development client
    needs: route
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # A sibling job, never part of the shipping iOS build or release.yml. Its
    # UI tests drive the iOS simulator, so it shares the simulator VM.
    runs-on: [self-hosted, josemac-sim]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create the iPhone 16 simulator the UI tests target
        # As for the shipping iOS job: the Xcode 27 image has the device type
        # but no device, and iOS 27 runtimes refuse it.
        if: runner.environment != 'self-hosted'
        run: |
          set -euo pipefail
          if ! xcrun simctl list devices available | grep -q '^ *iPhone 16 ('; then
            for runtime in $(xcrun simctl list runtimes available | sed -n 's/^iOS .* - \(com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]*\)$/\1/p' | sort -t- -k2,2nr -k3,3nr); do
              xcrun simctl create 'iPhone 16' com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime" >/dev/null 2>&1 && break
            done
          fi
          xcrun simctl list devices available | grep '^ *iPhone 16 ('
      - uses: ./.github/actions/mobile-rust
        with:
          platform: apple
      - name: Build and UI-test the UIKit client against the bench fixture
        run: bash apps/native/apple/uikit.sh test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caper-uikit-${{ github.sha }}
          path: |
            apps/native/apple/uikit-artifacts/
            apps/native/apple/UIKitResults.xcresult/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android / development APK
    needs: route
    runs-on: ${{ needs.route.outputs.linux == 'true' && fromJSON('["self-hosted","joselinux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      # The emulator system image no longer fits beside the build on a stock
      # hosted runner ("No space left on device"); drop toolchains Caper never uses.
      - name: Free disk space on the GitHub runner
        if: runner.environment != 'self-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/PyPy /usr/share/swift /opt/microsoft /opt/google/chrome
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Caches the Gradle user home (wrapper, dependencies). Writes only from
      # main; manual runs on other branches restore read-only.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1'
      # Firebase (and so phone push) stays off when the secret is unset; the
      # build works either way. The secret is the base64 of google-services.json.
      - name: Write google-services.json from GOOGLE_SERVICES_JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode >apps/native/android/app/google-services.json
            python -m json.tool apps/native/android/app/google-services.json >/dev/null
          fi
      # Gradle builds libcaper_mobile.so, the shared Rust library, with cargo-ndk.
      - uses: ./.github/actions/mobile-rust
        with:
          platform: android
      - name: Test, lint, build and package Android
        run: bash apps/native/android/build.sh
      - name: Record exact checked-out revision and checksums
        run: |
          python scripts/native_artifacts.py --target android-debug \
            --revision "$(git rev-parse HEAD)" --source apps/native/android/dist \
            --destination dist/native/android-debug
      - uses: actions/upload-artifact@v4
        with:
          name: caper-development-android-debug-${{ github.sha }}
          path: dist/native/android-debug/
          if-no-files-found: error
          retention-days: 14
      - name: Build a separate loopback-only fixture APK
        run: bash apps/native/android/fixture-build.sh
      - name: Start the local parity fixture (no external API or SFU)
        run: |
          node scripts/native-parity-fixture.mjs > "$RUNNER_TEMP/caper-fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/caper-fixture.pid"
          for attempt in {1..50}; do
            if curl --silent --fail http://127.0.0.1:3001/health >/dev/null; then break; fi
            sleep .1
          done
          curl --silent --fail http://127.0.0.1:3001/health
      - name: Enable emulator KVM on the GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Android guest, login, chat, management and narrow UI
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            CMAKE_BUILD_PARALLEL_LEVEL=1 apps/native/android/gradlew -p apps/native/android --no-daemon --max-workers=1 -PcaperFixtureMode=true -PcaperApiBaseUrl=http://localhost:3001 connectedDebugAndroidTest
            mkdir -p apps/native/android/dist/ui
            find apps/native/android/app/build/outputs/connected_android_test_additional_output -type f \( -name 'voice-roster-connected-*.png' -o -name 'profile-*-test-fixture.png' -o -name 'reaction-*-test-fixture.png' -o -name 'attach-drawer-*-test-fixture.png' \) -exec cp {} apps/native/android/dist/ui/ \;
            test -s apps/native/android/dist/ui/voice-roster-connected-closed.png && test -s apps/native/android/dist/ui/voice-roster-connected-open.png
            python apps/native/android/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caper-ui-android-${{ github.sha }}
          path: |
            apps/native/android/dist/ui/
            apps/native/android/app/build/reports/tests/
            apps/native/android/app/build/test-results/
            apps/native/android/app/build/reports/androidTests/
            apps/native/android/app/build/outputs/androidTest-results/
            apps/native/android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the parity fixture
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/caper-fixture.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/caper-fixture.pid")" 2>/dev/null || true
          fi
      # Self-hosted runners keep the workspace between jobs.
      - name: Remove google-services.json
        if: always()
        run: rm -f apps/native/android/app/google-services.json
