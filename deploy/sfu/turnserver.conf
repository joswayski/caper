# TURN for clients on networks that block direct UDP to the SFU.
# Credentials are TURN REST (use-auth-secret) values minted by caper-sfu.
listening-port=3478
tls-listening-port=443
min-port=49160
max-port=49999
use-auth-secret
fingerprint
no-cli
no-multicast-peers
no-software-attribute
no-tlsv1
no-tlsv1_1
# Relays may only reach the SFU itself (allowed-peer-ip is passed as an
# argument); never private or metadata networks.
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
log-file=stdout
simple-log
