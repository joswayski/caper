name: caper-staging

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: caperchat
      POSTGRES_USER: caper_migrate
      POSTGRES_PASSWORD: caper_migrate
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=caper_runtime psql --host=127.0.0.1 --username=caper_runtime --dbname=caperchat --no-password --command='SELECT 1' >/dev/null
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - caper-staging-postgres:/var/lib/postgresql/data
      - ./compose/staging/postgres-init.sql:/docker-entrypoint-initdb.d/runtime-role.sql:ro

  valkey:
    image: valkey/valkey:9.1.2-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://caper_runtime:caper_runtime@postgres:5432/caperchat?sslmode=disable}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgres://caper_migrate:caper_migrate@postgres:5432/caperchat?sslmode=disable}
      DATABASE_ALLOW_INSECURE: "true"
      APP_SECRET_ID: ${APP_SECRET_ID:-staging/apps/caper}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_CODE_ATTEMPTS: ${AUTH_CODE_ATTEMPTS:-3}
      AUTH_EMAIL_15M_LIMIT: ${AUTH_EMAIL_15M_LIMIT:-3}
      AUTH_EMAIL_DAILY_LIMIT: ${AUTH_EMAIL_DAILY_LIMIT:-5}
      AUTH_IP_HOURLY_LIMIT: ${AUTH_IP_HOURLY_LIMIT:-10}
      AUTH_GLOBAL_HOURLY_LIMIT: ${AUTH_GLOBAL_HOURLY_LIMIT:-500}
      SPACE_OWNED_LIMIT: ${SPACE_OWNED_LIMIT:-20}
      SPACE_MEMBERSHIP_LIMIT: ${SPACE_MEMBERSHIP_LIMIT:-100}
      SPACE_CHANNEL_LIMIT: ${SPACE_CHANNEL_LIMIT:-100}
      NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-Caper <noreply@staging.caper.chat>}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-staging-caper-transactional}
      MEDIA_ENABLED: ${MEDIA_ENABLED:-false}
      MEDIA_BIND: 0.0.0.0:3001
      CHAT_ENABLED: ${CHAT_ENABLED:-true}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      VALKEY_ALLOW_INSECURE: "true"
      CF_SFU_APP_ID: ${CF_SFU_APP_ID:-}
      CF_SFU_APP_SECRET: ${CF_SFU_APP_SECRET:-}
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-caper_api=info,tower_http=info}
      ENVIRONMENT: staging
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-caper}
      AXIOM_ENDPOINT: ${AXIOM_ENDPOINT:-}

  chat-gateway:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
    command: ["--gateway"]
    # API startup owns migrations; retry if it has not finished yet.
    restart: on-failure
    stop_grace_period: 65s
    depends_on:
      - api
    environment:
      CHAT_ENABLED: ${CHAT_ENABLED:-true}
      CHAT_GATEWAY_BIND: 0.0.0.0:3002
      PRESENCE_IDLE_TIMEOUT_SECONDS: ${PRESENCE_IDLE_TIMEOUT_SECONDS:-600}
      GATEWAY_MAX_CONNECTIONS: ${GATEWAY_MAX_CONNECTIONS:-4096}
      MEDIA_ENABLED: ${MEDIA_ENABLED:-false}
      CF_SFU_APP_ID: ${CF_SFU_APP_ID:-}
      CF_SFU_APP_SECRET: ${CF_SFU_APP_SECRET:-}
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://caper_runtime:caper_runtime@postgres:5432/caperchat?sslmode=disable}
      DATABASE_ALLOW_INSECURE: "true"
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
      VALKEY_ALLOW_INSECURE: "true"
      APP_SECRET_ID: ${APP_SECRET_ID:-staging/apps/caper}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RUST_LOG: ${RUST_LOG:-caper_api=info}
      ENVIRONMENT: staging

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3000

  gateway:
    image: caddy:2.10-alpine
    depends_on:
      - api
      - chat-gateway
      - web
    ports:
      - "3000:3000"
    volumes:
      - ./compose/staging/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  caper-staging-postgres:
